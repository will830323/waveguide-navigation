<!doctype html>
<html lang="en" data-theme="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b3b2e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Panduan">
<title>Panduan</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="logo-96.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Saira+Semi+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: full-bleed tilted map. Idle: "Where to?" pill + chips on top, bottom sheet for routes/reports/settings.
   Driving: navy maneuver panel on top, speed cluster bottom-left, report button bottom-right, trip bar along the bottom. */
:root{
  --navy:#0f1d33; --navy-2:#1b2d4d; --copper:#c8743a; --copper-ink:#ffffff;
  --signal:#ffc21a; --signal-ink:#2b1f00; --danger:#e0412f; --ok:#1f9d6b;
  --route:#1463ff; --route-alt:#7f93b5; --casing:#0a2a6b; --halo:#ffffff;
  --bg:#e2f0fc; --surface:#ffffff; --surface-2:#eaf3fc; --fg:#0f1d33; --muted:#59657d; --line:#d8dee8;
  --shadow:0 8px 28px rgba(15,29,51,.22);
  --f-display:"Saira Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
:root[data-theme="night"]{
  --navy:#0d1830; --navy-2:#1d3054;
  --route:#3d8bff; --route-alt:#8a97ad; --casing:#ffffff; --halo:#0b1322;
  --bg:#0b1322; --surface:#16223a; --surface-2:#1f2d49; --fg:#e8eef8; --muted:#9aa8c2; --line:#2b3b5a;
  --shadow:0 8px 28px rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.4 var(--f-body);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--route);outline-offset:2px}
#map{position:fixed;inset:0;background:var(--bg)}
.maplibregl-ctrl-attrib{font-size:10px}
.maplibregl-ctrl-bottom-left,.maplibregl-ctrl-bottom-right{bottom:calc(env(safe-area-inset-bottom,0px) + var(--sheet-h,0px))}

/* ---------- top: search ---------- */
#top{position:fixed;z-index:500;left:0;right:0;top:0;pointer-events:none;
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:8px}
#top>*{pointer-events:auto}
.search{display:flex;align-items:center;gap:6px;background:var(--surface);border-radius:999px;box-shadow:var(--shadow);padding:5px 5px 5px 8px}
.mark{flex:none;width:36px;height:36px;border-radius:10px;display:block}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font:700 17px var(--f-body);padding:8px 4px;outline:none}
.search input::placeholder{color:var(--muted);font-weight:400}
.ib{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:18px;color:var(--muted)}
.ib svg{width:22px;height:22px}
#results{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);overflow:hidden auto;max-height:55vh}
#results .lh{padding:10px 16px 4px;font:600 12px var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
#results button{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:11px 16px;border-top:1px solid var(--line)}
#results .ico{flex:none;width:32px;height:32px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:15px}
#results .tx{min-width:0;flex:1}
#results b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#results span.s{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;background:var(--surface);border-radius:999px;padding:8px 13px;box-shadow:0 2px 10px rgba(15,29,51,.16);font-weight:700;font-size:13px;white-space:nowrap}
.chip.saved{background:var(--navy);color:#fff}
.chip.fuel{background:var(--copper);color:var(--copper-ink)}

/* ---------- floating buttons ---------- */
.fabs{position:fixed;z-index:500;display:flex;flex-direction:column;gap:10px;transition:bottom .25s}
#fabR{right:max(10px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + var(--sheet-h,0px) + 14px);transition:opacity .3s,transform .3s}
body:not(.navmode) .fab:not(.report){width:44px;height:44px}
body:not(.navmode) .fab:not(.report) svg{width:21px;height:21px}
body:not(.navmode) #fabR{gap:8px}
body.navmode.calm #fabR .fab:not(#locBtn){opacity:0;transform:translateX(70px);pointer-events:none}
body.navmode.calm #navLeft .pill:not(#lockPill):not(#voicePill){opacity:0;pointer-events:none}
#navLeft .pill{transition:opacity .3s}
.fab{width:52px;height:52px;border-radius:50%;background:var(--surface);color:var(--fg);box-shadow:var(--shadow);display:grid;place-items:center;font:700 13px var(--f-display);letter-spacing:.04em}
.fab svg{width:24px;height:24px}
.fab.on{color:var(--route)}
.fab.report{width:62px;height:62px;background:var(--signal);color:var(--signal-ink)}
.fab.report svg{width:30px;height:30px}
#compass svg{transition:transform .3s}

/* ---------- speed cluster ---------- */
#speedo{position:fixed;z-index:650;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + var(--sheet-h,0px) + 14px);display:flex;flex-direction:column;gap:8px;align-items:center;transition:bottom .25s}
.limit{width:56px;height:56px;border-radius:50%;background:#fff;border:6px solid #d42b1e;display:grid;place-items:center;color:#111;box-shadow:var(--shadow)}
.limit b{font:700 22px/1 var(--f-display);font-variant-numeric:tabular-nums}
.limit.est{border-style:dashed}
.spd{width:66px;height:66px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;text-align:center;line-height:1;border:3px solid var(--line)}
.spd b{font:700 26px var(--f-display);font-variant-numeric:tabular-nums;display:block}
.spd small{font-size:10px;color:var(--muted);letter-spacing:.04em}
.spd.over{background:var(--danger);border-color:var(--danger);color:#fff}
.spd.over small{color:#fff}

/* ---------- bottom sheet ---------- */
#sheet{position:fixed;z-index:800;left:0;right:0;bottom:0;background:var(--surface);border-radius:22px 22px 0 0;box-shadow:var(--shadow);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px));
  max-height:66vh;overflow-y:auto;transition:transform .25s}
#sheet.closed{transform:translateY(110%)}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.hd h2{margin:0;font:700 25px/1.1 var(--f-display);text-wrap:balance}
.hd p{margin:2px 0 12px;color:var(--muted);font-size:13px}
.routes{display:flex;flex-direction:column;gap:8px}
.rc{display:grid;grid-template-columns:1fr auto;gap:3px 10px;text-align:left;padding:12px 14px;border:2px solid var(--line);border-radius:16px;background:var(--surface)}
.rc.sel{border-color:var(--route);background:color-mix(in srgb,var(--route) 7%,var(--surface))}
.rc .t{font:700 24px/1.05 var(--f-display);font-variant-numeric:tabular-nums}
.rc .d{font:600 15px var(--f-display);color:var(--muted);align-self:center;font-variant-numeric:tabular-nums}
.rc .via{grid-column:1/-1;color:var(--muted);font-size:13px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tag{font:700 11px var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--surface-2);color:var(--fg)}
.tag.best{background:var(--ok);color:#fff}
.tag.toll{background:var(--navy);color:#fff}
.tag.alert{background:var(--signal);color:var(--signal-ink)}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{flex:1;min-width:0;padding:13px 14px;border-radius:14px;font-weight:700;background:var(--surface-2);text-align:center}
.btn.go{background:var(--route);color:#fff;font:700 20px var(--f-display);letter-spacing:.06em;flex:2}
.btn.sm{flex:none;padding:9px 13px;font-size:13px}
.btn.warn{background:var(--danger);color:#fff}
.hint{color:var(--muted);font-size:13px;margin:12px 0 0}
.stop{display:flex;align-items:center;gap:8px;margin:0 0 10px;padding:8px 12px;border-radius:12px;background:var(--surface-2);font-size:14px}
.stop b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* report grid */
.hzgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.hz{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:16px;background:var(--surface-2);font-size:12px;font-weight:700;text-align:center;line-height:1.15}
.hz i{font-style:normal;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:24px;background:var(--surface)}

/* map type picker */
.mtgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mt{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 4px 10px;border-radius:16px;border:2px solid var(--line);font-size:12px;font-weight:700;text-align:center}
.mt.on{border-color:var(--route)}
.mtsw{width:100%;aspect-ratio:1;max-width:72px;border-radius:12px;display:grid;place-items:center;font-size:26px}
.mt-street{background:linear-gradient(135deg,#e2f0fc 55%,#8fc3ee 55%)}
.mt-landmark{background:linear-gradient(135deg,#eef5fb 55%,#cfe8c4 55%)}
.mt-dark{background:linear-gradient(135deg,#16223a 55%,#0b1322 55%)}
/* lists (fuel, settings) */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 2px;border-top:1px solid var(--line);text-align:left;width:100%}
.li:first-child{border-top:0}
.li .tx{flex:1;min-width:0}
.li b{display:block}
.li span{color:var(--muted);font-size:13px}
.li .dd{font:600 15px var(--f-display);color:var(--muted);font-variant-numeric:tabular-nums}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.seg button{padding:7px 11px;border-radius:9px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.sw{width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw.on{background:var(--ok)}
.sw.on::after{transform:translateX(18px)}
.field{width:100%;margin-top:8px;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface-2);color:var(--fg);font:14px var(--f-body)}

/* travel modes + route preferences */
.modes{display:flex;gap:6px;margin:0 0 8px;overflow-x:auto;scrollbar-width:none}
/* drive / public transport switch */
.tswitch{display:flex;background:var(--surface);border-radius:999px;box-shadow:0 2px 10px rgba(15,29,51,.16);padding:4px;gap:4px}
.tswitch button{flex:1;padding:9px 10px;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted)}
.tswitch button.on{background:var(--route);color:#fff}
/* transit journeys */
.trbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 10px}
.trbar select,.trbar input{padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface-2);color:var(--fg);font:700 13px var(--f-body)}
.trbar input{min-width:0;flex:1}
.trcmp{font-size:13px;color:var(--muted);margin:0 0 10px;padding:8px 12px;border-radius:12px;background:var(--surface-2)}
.rc.tr .fare{font:700 18px var(--f-display);font-variant-numeric:tabular-nums;align-self:center}
.legs1{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:6px}
.leg{display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border-radius:9px;font:700 13px var(--f-body);background:var(--route);color:#fff;font-variant-numeric:tabular-nums}
.leg.walk{background:var(--surface-2);color:var(--fg)}
.legsep{color:var(--muted);font-size:12px}
.tag.cheap{background:var(--ok);color:#fff}
.tag.live{background:#e8f6ee;color:#0b7a4b}
.tsteps{list-style:none;margin:6px 0 4px;padding:0 0 0 6px;display:flex;flex-direction:column}
.tsteps li{display:flex;gap:12px;position:relative;padding:0 0 14px}
.tsteps li::before{content:"";position:absolute;left:15px;top:30px;bottom:0;width:4px;border-radius:2px;background:var(--lc,var(--line))}
.tsteps li:last-child::before{display:none}
.tsteps li.walk::before{background:repeating-linear-gradient(var(--muted) 0 4px,transparent 4px 9px);width:3px}
.tsteps i{flex:none;font-style:normal;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--lc,var(--surface-2));color:#fff;font-size:16px;position:relative;z-index:1;border:3px solid var(--surface)}
.tsteps .tx{min-width:0;flex:1;display:flex;flex-direction:column;gap:1px;padding-top:4px}
.tsteps b{font-weight:700}
.tsteps span{font-size:13px;color:var(--muted)}
.tsteps details{font-size:13px;color:var(--muted)}
.tsteps summary{cursor:pointer;color:var(--route);font-weight:700}
.modes::-webkit-scrollbar{display:none}
.mode{flex:none;display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--surface-2);font-weight:700;font-size:13px}
.mode.on{background:var(--navy);color:#fff}
.prefs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.pref{padding:6px 11px;border-radius:999px;border:1.5px solid var(--line);font-size:12px;font-weight:700;color:var(--muted)}
.pref.on{border-color:var(--route);color:var(--route);background:color-mix(in srgb,var(--route) 8%,var(--surface))}
.tag.traffic{background:var(--danger);color:#fff}
.tag.flow{background:var(--ok);color:#fff}
.tag.info{background:var(--surface-2);color:var(--fg)}

/* ---------- navigation (dark glass panels, Jalan Nav style) ---------- */
:root{ --panel:linear-gradient(160deg,rgba(17,54,49,.96),rgba(8,30,28,.96)); --panel-solid:#0d2c29; --panel-2:rgba(255,255,255,.09); --panel-ink:#f1f8f4; --panel-muted:#a3bdb4;
  --lime:#c6f23f; --mint:#1ee08c; --eta:#5ee28a; --endbtn:linear-gradient(135deg,#d7343c,#a3212b); --glow:0 0 0 1px rgba(198,242,63,.16),0 10px 28px rgba(0,0,0,.38); }
#navtop{position:fixed;z-index:700;left:0;right:0;top:0;
  padding:calc(env(safe-area-inset-top,0px) + 8px) max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px;align-items:flex-start;pointer-events:none}
#navtop>*{pointer-events:auto}
.man{align-self:stretch;background:var(--panel);color:var(--panel-ink);border-radius:20px;box-shadow:var(--glow);display:flex;align-items:center;gap:12px;padding:10px 14px 10px 10px;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.arrow{flex:none;width:58px;height:58px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,var(--lime),var(--mint));box-shadow:0 4px 14px rgba(30,224,140,.35)}
.arrow svg{width:42px;height:42px}
.arrow svg path,.arrow svg circle{stroke:#0b2a26}
.arrow svg text{fill:#0b2a26}
.arrow > span{font-size:32px!important}
.man .mtx{min-width:0;flex:1}
.man .line1{font:600 19px/1.2 var(--f-display);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.man .dist{font:700 27px/1 var(--f-display);color:var(--lime);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.man .road{font-size:13px;color:var(--panel-muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.manlist{flex:none;font-size:16px;opacity:.6}
.dirs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.dr{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 4px;border-top:1px solid var(--line)}
.dirs li:first-child .dr{border-top:0}
.dr.now{background:color-mix(in srgb,var(--route) 9%,var(--surface));border-radius:12px;padding-inline:8px}
.da{flex:none;width:42px;height:42px;border-radius:12px;background:var(--navy);display:grid;place-items:center}
.da svg{width:30px;height:30px}
.dt{flex:1;min-width:0;display:flex;flex-direction:column}
.dt b{font:700 16px/1.2 var(--f-display)}
.dt .rd{font-weight:700;font-size:13px;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dt .mt2{font-size:12px;color:var(--muted)}
.dd2{flex:none;text-align:right;font:700 15px var(--f-display);font-variant-numeric:tabular-nums;display:flex;flex-direction:column}
.dd2 small{font:400 11px var(--f-body);color:var(--muted)}
.then{display:inline-flex;gap:6px;align-items:center;background:var(--panel);color:var(--panel-ink);font:600 14px var(--f-display);padding:6px 12px;border-radius:10px;box-shadow:var(--shadow)}
#lanes{display:flex;gap:4px;background:var(--panel);padding:6px 8px;border-radius:14px;box-shadow:var(--glow)}
.lane{width:34px;height:38px;display:grid;place-items:center;border-radius:8px;opacity:.32}
.lane.ok{opacity:1;background:rgba(198,242,63,.2);box-shadow:inset 0 -3px 0 var(--lime)}
.lane svg{width:26px;height:26px}
#prog{position:fixed;z-index:640;left:max(20px,calc(env(safe-area-inset-left,0px) + 12px));top:calc(env(safe-area-inset-top,0px) + 250px);bottom:calc(env(safe-area-inset-bottom,0px) + var(--sheet-h,0px) + 140px);width:8px;border-radius:999px;background:var(--route);box-shadow:0 0 0 3px var(--surface),var(--shadow)}
#progDone{position:absolute;left:0;right:0;bottom:0;border-radius:999px;background:#9aa6ba}
#progCar{position:absolute;left:50%;width:22px;height:22px;margin:0 0 -11px -11px;border-radius:50%;background:var(--surface);border:4px solid var(--route);box-shadow:var(--shadow)}
#progFlag{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:16px}
.pmark{position:absolute;left:50%;transform:translate(-50%,50%);font-size:15px;line-height:1;filter:drop-shadow(0 1px 2px rgba(0,0,0,.45))}
#alert{align-self:stretch;background:var(--signal);color:var(--signal-ink);border-radius:16px;padding:10px 12px;font:700 16px var(--f-display);box-shadow:var(--shadow);display:flex;gap:10px;align-items:center}
#alert .ae{font-size:26px}
#alert .at{flex:1;min-width:0}
#alert button{padding:8px 12px;border-radius:10px;background:rgba(0,0,0,.12);font:700 14px var(--f-body)}
#tripbar{position:fixed;z-index:700;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 10px);
  background:var(--panel);color:var(--panel-ink);border-radius:22px;box-shadow:var(--glow);padding:16px 16px 14px;display:flex;flex-direction:column;gap:4px;overflow:hidden;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.tdest{display:flex;align-items:center;gap:6px;font:700 15px/1.25 var(--f-body);color:var(--panel-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tdest svg{flex:none;width:16px;height:16px}
.tdest span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.tprog{position:absolute;left:0;right:0;top:0;height:4px;background:rgba(255,255,255,.08)}
.tprog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mint),var(--lime));box-shadow:0 0 10px var(--lime);transition:width .6s linear}
.etal{display:inline-block;vertical-align:.28em;font:700 11px var(--f-body);letter-spacing:.12em;padding:3px 7px;border-radius:6px;background:rgba(198,242,63,.16);color:var(--lime);margin-right:2px;-webkit-text-fill-color:var(--lime)}
.tbig{font:700 min(5.2vw,30px)/1.15 var(--f-display);background:linear-gradient(90deg,var(--lime),var(--mint));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tsub{font-size:12.5px;color:var(--panel-muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:6px}
.tb{flex:none;height:46px;min-width:46px;padding:0 16px;border-radius:14px;background:var(--panel-2);color:var(--panel-ink);display:flex;align-items:center;justify-content:center;gap:7px;font:700 15px var(--f-body);border:1px solid rgba(255,255,255,.08)}
.tb svg{width:20px;height:20px}
.tb.end{background:var(--endbtn);color:#fff;border:0;box-shadow:0 4px 14px rgba(215,52,60,.35)}
/* driving: square dark buttons on the right, pills bottom-left */
body.navmode .fab{width:52px;height:52px;border-radius:16px;background:var(--panel);color:var(--panel-ink);box-shadow:var(--glow);font:700 13px var(--f-body);flex-direction:column;gap:1px}
body.navmode .fab svg{width:24px;height:24px}
body.navmode .fab small{font-size:10px;letter-spacing:.06em;opacity:.85}
body.navmode .fab.on{color:var(--lime)}
body.navmode .fab.lit{background:linear-gradient(135deg,var(--lime),var(--mint));color:#0b2a26}
body.navmode #fabR{gap:8px}
body.navmode #speedo{position:static;display:flex;flex-direction:column;align-items:center;gap:8px}
body.navmode .spd{width:52px;height:60px;border-radius:16px;background:var(--panel);color:var(--panel-ink);border:0;box-shadow:var(--glow),inset 0 -3px 0 var(--mint)}
body.navmode .spd b{font-size:24px}
body.navmode .spd small{color:var(--panel-muted)}
body.navmode .spd.over{background:linear-gradient(135deg,#ef4b3f,#b71f24);color:#fff;box-shadow:0 0 0 3px rgba(239,75,63,.35),0 8px 20px rgba(0,0,0,.35);animation:pulse 1s infinite}
body.navmode .limit{width:50px;height:50px;border-width:5px}
.navonly{display:none!important}
body.navmode .navonly{display:grid!important}
body.navmode .idleonly{display:none!important}
body.navmode .navonly[hidden]{display:none!important}
#navLeft{position:fixed;z-index:650;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + var(--sheet-h,0px) + 14px);display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.pill{display:flex;align-items:center;gap:9px;padding:11px 18px 11px 12px;border-radius:999px;background:var(--panel);color:var(--panel-ink);font:700 16px var(--f-body);box-shadow:var(--glow)}
.pill .pi{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--lime),var(--mint));color:#0b2a26}
.pill .pi svg{width:18px;height:18px}
.pill.rep{background:linear-gradient(135deg,#ffd23f,#ffb000);color:#2b1f00;box-shadow:0 6px 18px rgba(255,176,0,.35)}
.pill.rep .pi{background:#2b1f00;color:#ffd23f}

/* friends, HUD, mic, settings sections */
#friends{display:flex;flex-direction:column;gap:6px}
.friend-row{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:14px;box-shadow:0 2px 10px rgba(15,29,51,.16);padding:8px 12px;text-align:left;width:100%}
.friend-row b{font-weight:700}
.friend-row span{color:var(--muted);font-size:12px}
.friend{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.friend .car{width:34px;height:34px;border-radius:50%;background:var(--copper);border:3px solid #fff;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.friend .car svg{width:18px;height:18px}
.friend .nm{background:var(--navy);color:#fff;font:700 11px var(--f-body);padding:2px 7px;border-radius:999px;white-space:nowrap}
.ib.listening,.fab.listening{background:var(--danger);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--danger) 30%,transparent)}}
#hud{position:fixed;inset:0;z-index:960;background:#000;color:#41ff9a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4vh;padding:20px}
#hudIn{display:flex;flex-direction:column;align-items:center;gap:3vh;font-family:var(--f-display)}
#hudIn.mirror{transform:scaleY(-1)}
.hud-spd{font:700 min(34vw,30vh)/1 var(--f-display);font-variant-numeric:tabular-nums}
.hud-spd.over{color:#ff4b3a}
.hud-man{display:flex;align-items:center;gap:4vw;font:700 min(12vw,10vh)/1 var(--f-display)}
.hud-man svg{width:min(16vw,13vh);height:min(16vw,13vh)}
.hud-man svg path,.hud-man svg circle{stroke:#41ff9a}
.hud-ins{font:600 min(6vw,5vh) var(--f-display);text-align:center}
.hud-eta{font:600 min(5vw,4vh) var(--f-display);opacity:.8}
.hud-ctl{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;gap:10px}
.hud-ctl button{padding:10px 16px;border-radius:999px;background:#1b1b1b;color:#ddd;font-weight:700}
.sec{font:600 12px var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:16px 2px 2px}
.pts{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--navy);color:#fff;margin-bottom:4px}
.pts b{font:700 26px var(--f-display);font-variant-numeric:tabular-nums}
.pts span{opacity:.8;font-size:13px}
.plan-leave{font:700 30px var(--f-display);font-variant-numeric:tabular-nums}

/* tourist mode, nearby map, walking guide */
.chip.tour{background:linear-gradient(135deg,#c6f23f,#1ee08c);color:#0b2a26}
.chip.touroff{background:var(--surface);color:var(--fg);border:1.5px dashed #1ee08c}
.npin{width:32px;height:32px;border-radius:50%;background:#fff;border:3px solid var(--c,#1463ff);display:grid;place-items:center;font-size:15px;box-shadow:0 3px 8px rgba(0,0,0,.3);cursor:pointer}
.npin.rec{border-color:#ffb000;box-shadow:0 0 0 3px rgba(255,176,0,.35),0 3px 8px rgba(0,0,0,.3)}
.npin.sm{width:28px;height:28px;font-size:13px;border-width:2.5px}
.ncats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 0 10px;padding-bottom:2px}
.ncats::-webkit-scrollbar{display:none}
.ncat{flex:none;display:flex;align-items:center;gap:5px;padding:7px 11px;border-radius:999px;background:var(--surface-2);font-weight:700;font-size:13px;color:var(--muted);border:1.5px solid transparent}
.ncat.on{background:var(--surface);color:var(--fg);border-color:var(--c,#1ee08c)}
.ncat b{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700}
.bigbtn{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border-radius:16px;background:linear-gradient(135deg,#0d2c29,#14403b);color:#f1f8f4;text-align:left;margin:0 0 12px}
.bigbtn i{font-style:normal;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:linear-gradient(135deg,#c6f23f,#1ee08c)}
.bigbtn b{display:block;font-size:16px}
.bigbtn span{font-size:12.5px;opacity:.8}
.tourbox{margin:12px 0 0;padding:12px;border-radius:16px;background:linear-gradient(135deg,rgba(198,242,63,.14),rgba(30,224,140,.1));border:1.5px solid rgba(30,224,140,.35)}
.tourbox h3{margin:0 0 8px;font:700 16px var(--f-display);display:flex;align-items:center;gap:6px}
.tourbox .ncats{margin:0}
.tli{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:12px 2px;border-top:1px solid var(--line)}
.tli:first-child{border-top:0}
.tli .th{flex:none;width:64px;height:64px;border-radius:12px;background:var(--surface-2) center/cover no-repeat;display:grid;place-items:center;font-size:26px}
.tli .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.tli b{font-weight:700}
.tli .bl{font-size:12.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tli .at{font-size:12px;color:var(--fg);font-weight:700}
.tag.rec{background:linear-gradient(135deg,#ffd23f,#ffb000);color:#2b1f00}
.tour-card{display:flex;gap:10px;align-items:center}
.tour-card img{width:54px;height:54px;border-radius:10px;object-fit:cover;flex:none}
.wg{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.wg li{border-radius:18px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line)}
.wg .ph{position:relative;aspect-ratio:16/10;max-width:100%;background:#cfd8e3 center/cover no-repeat;display:grid;place-items:center;color:var(--muted);font-size:13px}
.wg .ph .num{position:absolute;left:10px;top:10px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#c6f23f,#1ee08c);color:#0b2a26;font:700 15px var(--f-display);box-shadow:0 2px 8px rgba(0,0,0,.3)}
.wg .ph .dir{position:absolute;right:10px;top:10px;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(13,44,41,.9)}
.wg .ph .dir svg{width:30px;height:30px}
.wg .ph .cr{position:absolute;left:0;right:0;bottom:0;padding:14px 10px 5px;font-size:10.5px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.65));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wg .ph .cr a{color:#fff}
.wg .wt{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px}
.wg .wt b{font:700 17px/1.25 var(--f-display)}
.wg .wt span{font-size:13px;color:var(--muted)}
.wg .wt .lm{color:var(--fg);font-weight:700}

/* trip planner */
.tpf{position:relative;display:grid;grid-template-columns:1fr auto;gap:8px 8px;align-items:center;margin:0 0 10px}
.tpin{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:14px;padding:4px 6px 4px 8px;border:1.5px solid var(--line);min-width:0}
.tpin:focus-within{border-color:var(--route)}
.tpin input{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font:700 15px var(--f-body);padding:9px 2px;outline:none}
.tpin input::placeholder{color:var(--muted);font-weight:400}
.dot{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:700 13px var(--f-display);color:#fff}
.dot.a{background:#14a86a}.dot.b{background:#e8262c}
.tpin .me{width:auto;height:auto}
.tpswap{grid-row:1/3;grid-column:2;width:40px;height:40px;border-radius:12px;background:var(--surface-2);font-size:18px;display:grid;place-items:center;border:1.5px solid var(--line)}
.tpsug{grid-column:1/-1;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;overflow:hidden auto;max-height:240px}
.tpsug button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:10px 12px;border-top:1px solid var(--line)}
.tpsug button:first-child{border-top:0}
.tpsug b{display:block;font-weight:700}
.tpsug span{color:var(--muted);font-size:12.5px}
.tpsum{margin:12px 0;padding:14px 16px;border-radius:18px;background:linear-gradient(160deg,#11362f,#081e1c);color:#f1f8f4;box-shadow:0 0 0 1px rgba(198,242,63,.16),0 10px 24px rgba(0,0,0,.25)}
.tpsum .ab{font-size:13px;color:#a3bdb4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tpsum .rec{font:700 13px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:#c6f23f;margin-top:8px}
.tpsum .big{font:700 min(5.2vw,26px)/1.2 var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:linear-gradient(90deg,#c6f23f,#1ee08c);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;font-variant-numeric:tabular-nums}
.tpsum .why{font-size:13px;color:#cfe0d9;margin-top:4px}
.mc{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;width:100%;text-align:left;padding:12px 14px;border:2px solid var(--line);border-radius:16px;background:var(--surface)}
.mc.rec{border-color:#14a86a;background:color-mix(in srgb,#1ee08c 7%,var(--surface))}
.mc .mi{grid-row:1/4;font-size:28px}
.mc .t{font:700 22px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.mc .d{font:600 15px var(--f-display);color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.mc .ln{grid-column:2/4;font-size:13px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.mc .ln b{color:var(--fg)}
.mcx{margin:-4px 0 4px;padding:10px 12px 12px;border:2px solid var(--line);border-top:0;border-radius:0 0 16px 16px;display:flex;flex-direction:column;gap:6px}
.mcx .alt{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:6px 0;border-top:1px dashed var(--line)}
.mcx .alt:first-child{border-top:0}
.frompin{width:26px;height:26px;border-radius:50%;background:#14a86a;color:#fff;border:3px solid #fff;display:grid;place-items:center;font:700 12px var(--f-display);box-shadow:0 2px 6px rgba(0,0,0,.4)}

/* driving-safety lock */
body.locked #alert button{display:none}
.lockpill{background:var(--panel);color:var(--panel-ink)}
.lockpill .pi{background:#ffd23f!important;color:#2b1f00!important}
.legal{position:fixed;inset:0;z-index:990;background:rgba(5,20,18,.55);display:flex;align-items:flex-end;justify-content:center;padding:0 max(0px,env(safe-area-inset-right,0px)) 0 max(0px,env(safe-area-inset-left,0px))}
.legal .card{width:100%;max-width:560px;max-height:88vh;overflow-y:auto;background:var(--surface);color:var(--fg);border-radius:24px 24px 0 0;padding:22px 20px calc(env(safe-area-inset-bottom,0px) + 18px)}
.legal h2{margin:0 0 4px;font:700 24px/1.15 var(--f-display)}
.legal ul{margin:10px 0;padding-left:20px;display:flex;flex-direction:column;gap:7px;font-size:14.5px}
.legal .big{font-size:44px;line-height:1}
.legal a{color:var(--route)}

/* ---------- markers ---------- */
.me{width:56px;height:56px;position:relative}
.me::before{content:"";position:absolute;inset:6px;border-radius:50%;background:rgba(30,224,140,.35);animation:mepulse 2s ease-out infinite}
@keyframes mepulse{0%{transform:scale(.7);opacity:.9}100%{transform:scale(1.7);opacity:0}}
.me svg{position:relative;width:56px;height:56px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.4))}
.hzpin.tt{border-color:var(--danger)}
.hzpin.osm{border-color:#9aa6ba;width:32px;height:32px;font-size:16px}
.hzpin{width:40px;height:40px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:21px;box-shadow:0 3px 10px rgba(0,0,0,.3);border:3px solid var(--signal);cursor:pointer}
.destpin{width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--danger);border:4px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.4)}
.stoppin{width:22px;height:22px;border-radius:50%;background:var(--copper);border:4px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.fuelpin{width:30px;height:30px;border-radius:50%;background:var(--copper);color:#fff;display:grid;place-items:center;font-size:15px;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);cursor:pointer}
.maplibregl-popup-content{background:var(--surface);color:var(--fg);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);font-family:var(--f-body)}
.maplibregl-popup-tip{border-top-color:var(--surface)!important;border-bottom-color:var(--surface)!important}
.pop b{font:700 17px var(--f-display)}
.pop .m{color:var(--muted);font-size:13px}

#toast{position:fixed;z-index:900;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + var(--sheet-h,0px) + 96px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;max-width:calc(100% - 32px);text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="map"></div>

<!-- idle: search -->

  <div class="search">
    <img class="mark" src="logo-96.png" alt="" width="36" height="36">

    <button class="ib" id="setBtn" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg></button>
  </div>
  <div id="results" hidden></div>

  <div class="chips" id="chips"></div>
  <div id="friends"></div>
</div>

<!-- right-side buttons -->
<div class="fabs" id="fabR">
  <button class="fab" id="micFab" aria-label="Voice command" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor" fill-opacity=".15"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
  <button class="fab navonly" id="tiltBtn" aria-label="3D or 2D view"><span id="tiltIco"></span><small id="tiltTx">3D</small></button>

  <button class="fab idleonly" id="compass" aria-label="Toggle heading-up / north-up"><svg viewBox="0 0 24 24"><path d="M12 2l4 10h-8z" fill="#e0412f"/><path d="M12 22l-4-10h8z" fill="currentColor" opacity=".55"/></svg></button>
  <button class="fab" id="voiceBtn" aria-label="Voice guidance on or off"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path id="voiceWaves" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg></button>
  <button class="fab navonly" id="rerouteBtn" aria-label="Recalculate route"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg></button>
  <button class="fab navonly" id="dayBtn" aria-label="Day or night map"><span id="dayIco"></span></button>
  <button class="fab" id="locBtn" aria-label="Centre on my location"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3.5" fill="currentColor"/><circle cx="12" cy="12" r="8"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3"/></svg></button>
  <button class="fab report idleonly" id="reportBtn" aria-label="Report a hazard"><svg viewBox="0 0 24 24"><path d="M12 3L2 20h20z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><path d="M12 9v5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><circle cx="12" cy="17" r="1.4" fill="currentColor"/></svg></button>
</div>

<!-- speed cluster -->

  <div class="limit" id="limit" hidden><b id="limitV">–</b></div>
  <div class="spd" id="spdBox"><div><b id="spd">0</b><small>km/h</small></div></div>
</div>

<!-- bottom sheet -->
<div id="sheet" class="closed" role="dialog" aria-live="polite"></div>

<!-- navigation -->
<div id="navtop" hidden>
  <div class="man" id="manPanel" role="button" tabindex="0" aria-label="Show all directions">
    <div class="arrow" id="navArrow"></div>

// Recolour land/water/buildings light blue, widen roads, and make landmark icons and names larger.
function scaleNum(v,k){
  if(typeof v==="number") return v*k;
  if(v && !Array.isArray(v) && Array.isArray(v.stops)) return {...v, stops:v.stops.map(([z,w])=>[z, typeof w==="number"?w*k:w])};
  if(Array.isArray(v) && v[0]==="interpolate") return v.map((x,i)=> i>=4 && i%2===0 && typeof x==="number" ? x*k : x);
  return v;
}
function tintMap(){
  if(S.mapType==="dark") return;
  const paint=(id,prop,val)=>{ try{ map.setPaintProperty(id,prop,val); }catch(e){} };
  const layout=(id,prop,val)=>{ try{ map.setLayoutProperty(id,prop,val); }catch(e){} };
  const blue = S.mapType==="street";
  map.getStyle().layers.forEach(l => {
    const id=l.id;
    if(l.type==="background") paint(id,"background-color", blue?"#e2f0fc":"#eef5fb");
    else if(l.type==="fill" && /^water|ocean|lake|river/i.test(id)) paint(id,"fill-color","#8fc3ee");
    else if(l.type==="line" && /waterway|river/i.test(id)) paint(id,"line-color","#8fc3ee");
    else if(blue && l.type==="fill" && /landuse|landcover|residential|industrial|commercial/i.test(id) && !/park|wood|grass|forest|wetland|cemetery|hospital|school/i.test(id)) paint(id,"fill-color","#d6e8f8");
    else if(blue && l.type==="fill" && /building/i.test(id)) paint(id,"fill-color","#c5dcf2");
    else if(blue && l.type==="fill-extrusion") paint(id,"fill-extrusion-color","#c5dcf2");
    else if(l.type==="line" && /road|highway|bridge|tunnel|street|motorway|trunk|primary|secondary|tertiary|minor/i.test(id) && !/rail|path|footway|cycle|ferry|aeroway|oneway|label/i.test(id)){

}

    map.setPaintProperty("sel-casing","line-gradient",passedGrad(f,"#6f7b8c",cssVar("--casing"))); } }catch(e){}

function addRouteLayers(){

    layout:{"line-join":"round","line-cap":"round"},paint:{"line-color":cssVar("--route-alt"),"line-width":W(5,8,13,20),"line-opacity":.95}}, before);
  map.addLayer({id:"sel-halo",type:"line",source:"routes",filter:["==",["get","sel"],true],
    layout:{"line-join":"round","line-cap":"round"},paint:{"line-color":cssVar("--halo"),"line-width":W(11,16,26,38),"line-opacity":.85}}, before);

    layout:{"line-join":"round","line-cap":"round"},paint:{"line-gradient":passedGrad(S.passed||0,"#6f7b8c",cssVar("--casing")),"line-width":W(8,12,20,30)}}, before);

let slAbort;
async function speedLimit(p){

  if(Date.now()-S.slAt<6000) return;
  S.slAt=Date.now(); S.slPos=p;
  const q='[out:json][timeout:8];way(around:25,'+p.lat.toFixed(6)+','+p.lng.toFixed(6)+')[highway~"^(motorway|trunk|primary|secondary|tertiary|unclassified|residential|living_street)(_link)?$"];out tags 6;';
  slAbort?.abort(); slAbort=new AbortController();
  try{
    const j = await (await fetch(CFG.overpass,{method:"POST", body:"data="+encodeURIComponent(q), signal:slAbort.signal})).json();
    const ways = (j.elements||[]).map(e=>e.tags||{});
    if(!ways.length){ S.limit=null; paintLimit(); return; }
    // prefer the way matching the road we're told we're on
    const cur = S.nav && S.R ? (S.R.steps[stepAt(S.R,S.lastIdx)]||{}) : {};
    const match = ways.find(w => (cur.name && w.name===cur.name) || (cur.ref && w.ref && w.ref.split(";").includes(cur.ref))) || ways[0];
    const ms = parseInt(match.maxspeed,10);
    if(ms){ S.limit=ms; S.limitEst=false; }

    paintLimit();

}

/* ---------------- routing ---------------- */
const motorised = () => S.mode==="car" || S.mode==="moto";
function withTimeout(p, ms){ return Promise.race([p, new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),ms))]); }
async function fetchRoutes(from, stops, to){
  const M = MODES[S.mode] || MODES.car;
  // Valhalla handles motorcycles and the avoid/shortest preferences; OSRM gives richer lane data for everything else.
  const wantV = !M.osrm || (motorised() && (S.avoidTolls || S.avoidHw || S.shortest));
  let routes = null;
  if(wantV){
    try{ routes = await valhallaRoutes(from, stops, to, M.valhalla); }
    catch(e){ if(!M.osrm) throw e; toast("Route preferences aren't reachable right now, so showing standard routes."); }
  }
  if(!routes) routes = await osrmRoutes(M.osrm, from, stops, to);
  if(motorised() && S.ttKey) await withTimeout(applyTraffic(routes, from, stops, to), 6000).catch(()=>{});
  return routes;
}
async function osrmRoutes(base, from, stops, to){
  const pts=[from,...stops,to].map(p=>p.lng.toFixed(6)+","+p.lat.toFixed(6)).join(";");
  const url=base+pts+"?overview=full&geometries=geojson&steps=true"+(stops.length?"":"&alternatives=3");
  const j = await (await fetch(url)).json();
  if(j.code!=="Ok" || !j.routes?.length) throw new Error(j.message||"No route found.");
  return j.routes.map(prep);
}
// Valhalla → the same step shape OSRM returns, so the rest of the app doesn't care which router answered.
function decode6(str){ let i=0, lat=0, lng=0; const out=[];
  while(i<str.length){ let b, sh=0, r=0; do{ b=str.charCodeAt(i++)-63; r|=(b&31)<<sh; sh+=5; }while(b>=32); lat+=(r&1)?~(r>>1):(r>>1);
    sh=0; r=0; do{ b=str.charCodeAt(i++)-63; r|=(b&31)<<sh; sh+=5; }while(b>=32); lng+=(r&1)?~(r>>1):(r>>1);
    out.push([lng/1e6, lat/1e6]); } return out; }
const VT = {1:["depart","straight"],2:["depart","right"],3:["depart","left"],4:["arrive","straight"],5:["arrive","right"],6:["arrive","left"],
  7:["new name","straight"],8:["continue","straight"],9:["turn","slight right"],10:["turn","right"],11:["turn","sharp right"],12:["turn","uturn"],13:["turn","uturn"],
  14:["turn","sharp left"],15:["turn","left"],16:["turn","slight left"],17:["on ramp","straight"],18:["on ramp","slight right"],19:["on ramp","slight left"],
  20:["off ramp","slight right"],21:["off ramp","slight left"],22:["fork","straight"],23:["fork","slight right"],24:["fork","slight left"],25:["merge","straight"],
  26:["roundabout","straight"],27:["exit roundabout","straight"],28:["continue","straight"],29:["continue","straight"],37:["merge","slight right"],38:["merge","slight left"]};
function vTrip(trip){
  const steps=[], all=[];
  trip.legs.forEach(leg => { const shape=decode6(leg.shape);
    leg.maneuvers.forEach(m => {
      const [type,modifier]=VT[m.type]||["turn","straight"];
      const names=m.street_names||m.begin_street_names||[];
      const ref=names.find(n=>/^[A-Z]{1,3}\s?\d+[A-Z]?$/.test(n))||"", name=names.find(n=>n!==ref)||"";
      const sg=m.sign||{}, txt=a=>(a||[]).map(x=>x.text).filter(Boolean);
      const coords=shape.slice(m.begin_shape_index, m.end_shape_index+1); if(coords.length<2) coords.push(coords[0]||shape[shape.length-1]);
      steps.push({distance:(m.length||0)*1000, duration:m.time||0, name, ref, exits:txt(sg.exit_number_elements).join(";"),
        destinations:[...txt(sg.exit_branch_elements),...txt(sg.exit_toward_elements)].join(";"),
        maneuver:{type, modifier, exit:m.roundabout_exit_count, location:shape[m.begin_shape_index]},
        geometry:{coordinates:coords}, intersections:m.toll?[{classes:["toll"]}]:[]});
    });
    all.push(...(all.length?shape.slice(1):shape));
  });
  return {distance:trip.summary.length*1000, duration:trip.summary.time, geometry:{coordinates:all}, legs:[{steps}]};
}
async function valhallaRoutes(from, stops, to, costing){
  const co={}; if(costing==="auto"||costing==="motorcycle") co[costing]={use_tolls:S.avoidTolls?0:0.5, use_highways:S.avoidHw?0:1, shortest:!!S.shortest};
  const body={locations:[from,...stops,to].map(p=>({lat:+p.lat.toFixed(6), lon:+p.lng.toFixed(6)})), costing, costing_options:co,
    directions_options:{units:"kilometers"}, alternates:stops.length?0:2};
  const j=await (await fetch(CFG.valhalla+"?json="+encodeURIComponent(JSON.stringify(body)))).json();
  if(!j.trip) throw new Error(j.error||"No route found.");
  return [j.trip, ...(j.alternates||[]).map(a=>a.trip)].filter(Boolean).map(t=>prep(vTrip(t)));
}
// TomTom live traffic: scale each route's time by the traffic factor TomTom reports for the closest-length route.
async function applyTraffic(routes, from, stops, to){

  const url=CFG.tomtom+"/routing/1/calculateRoute/"+locs+"/json?key="+encodeURIComponent(S.ttKey)+"&traffic=true&computeTravelTimeFor=all&routeRepresentation=summaryOnly&travelMode="+(S.mode==="moto"?"motorcycle":"car")+(stops.length?"":"&maxAlternatives=2")+(S.avoidTolls?"&avoid=tollRoads":"")+(S.avoidHw?"&avoid=motorways":"");

  const tt=((await r.json()).routes||[]).map(x=>x.summary).filter(Boolean);
  if(!tt.length) return;
  routes.forEach(rt => {
    const m=tt.reduce((a,b)=>Math.abs(b.lengthInMeters-rt.distance)<Math.abs(a.lengthInMeters-rt.distance)?b:a);
    const base=m.noTrafficTravelTimeInSeconds||m.travelTimeInSeconds, f=Math.min(4,Math.max(0.85,m.travelTimeInSeconds/base));
    rt.trafficDelay=Math.max(0,rt.duration*(f-1)); rt.duration*=f; rt.traffic=true;
  });
}
function prep(r){
  const steps=r.legs.flatMap(l=>l.steps), pts=[], stepStart=[];
  steps.forEach(s => { stepStart.push(Math.max(0,pts.length-1));
    s.geometry.coordinates.forEach((xy,j) => { if(pts.length && j===0) return; pts.push({lat:xy[1], lng:xy[0]}); }); });
  const cum=[0]; for(let i=1;i<pts.length;i++) cum[i]=cum[i-1]+hav(pts[i-1],pts[i]);
  const toll=steps.some(s=>(s.intersections||[]).some(x=>(x.classes||[]).includes("toll")));
  const byName={}; steps.forEach(s=>{ const n=s.ref?s.ref+(s.name?" "+s.name:""):s.name; if(n) byName[n]=(byName[n]||0)+s.distance; });
  const via=Object.entries(byName).sort((a,b)=>b[1]-a[1]).slice(0,2).map(x=>x[0]);
  return {steps, pts, cum, stepStart, toll, via, distance:r.distance, duration:r.duration, coords:r.geometry.coordinates};
}
function minDistToRoute(R,p){ let best=1e12; const step=R.pts.length>4000?2:1;
  for(let i=0;i<R.pts.length-1;i+=step){ const d=segProj(p,R.pts[i],R.pts[Math.min(i+step,R.pts.length-1)]).d; if(d<best) best=d; } return best; }
function allHazards(withCams){ return [...S.reports, ...S.incidents, ...(withCams && S.R && S.R.cams ? S.R.cams : [])]; }
// Reports on a route add delay, and the best route is chosen on adjusted time.
function scoreRoutes(list){
  list = list || S.routes;
  list.forEach(r => {
    r.alerts=allHazards(false).filter(h=>minDistToRoute(r,h)<45);
    // TomTom incidents are already inside a traffic-adjusted time, so only count them when traffic wasn't applied
    r.penalty=r.alerts.reduce((a,h)=> a + (h.src==="tomtom" ? (r.traffic?0:(h.delay||HZ[h.type].delay*60)) : (HZ[h.type].delay||0)*60), 0);
    r.eff=r.duration+r.penalty;
  });
  list.sort((a,b) => (S.avoidTolls && a.toll!==b.toll) ? (a.toll?1:-1) : S.shortest ? a.distance-b.distance : a.eff-b.eff);
  return list;
}

// Traffic lights and speed cameras along a route, from OpenStreetMap.
async function routeExtras(r){
  if(r.extras || !motorised()) return; r.extras="loading";
  const total=r.cum[r.cum.length-1], n=Math.min(600, Math.max(2, Math.round(total/120)));
  const pts=[]; let j=0; for(let k=0;k<=n;k++){ const d=total*k/n; while(j<r.cum.length-2 && r.cum[j+1]<d) j++; pts.push(r.pts[j]); }
  const line=pts.map(p=>p.lat.toFixed(5)+","+p.lng.toFixed(5)).join(",");
  const q='[out:json][timeout:25];(node(around:20,'+line+')["highway"="traffic_signals"];node(around:60,'+line+')["highway"="speed_camera"];);out body 3000;';
  try{
    const js=await (await fetch(CFG.overpass,{method:"POST", body:"data="+encodeURIComponent(q)})).json();
    const seen=new Set(), cams=[]; let lights=0;
    (js.elements||[]).forEach(e => { if(!isFinite(e.lat)) return; const tg=e.tags||{};
      if(tg.highway==="speed_camera") cams.push({id:"osm-"+e.id, type:"camera", src:"osm", lat:e.lat, lng:e.lon, t:Date.now(), limit:parseInt(tg.maxspeed,10)||null});
      else { const key=Math.round(e.lat/0.0005)+":"+Math.round(e.lon/0.0005); if(!seen.has(key)){ seen.add(key); lights++; } } }); // one junction ≈ one 50 m cell
    r.lights=lights; r.cams=cams; r.extras="done";
  }catch(e){ r.extras=null; }
}
async function loadExtrasAll(){ const list=S.routes.slice(); for(const r of list){ await routeExtras(r); if(S.view==="routes" && !S.nav && S.routes===list) renderRouteSheet(); } }

/* ---------------- directions list (every junction, in order) ---------------- */
function roadLabel(st){ const ref=(st.ref||"").replace(/;/g," / "), nm=st.name||""; return ref&&nm&&!nm.includes(ref) ? ref+" · "+nm : (nm||ref); }
function buildDirections(R, from){
  const rows=[]; let prevAt = null;
  for(let i=from||0;i<R.steps.length;i++){
    const st=R.steps[i], m=st.maneuver, at=R.cum[R.stepStart[i]], last=i===R.steps.length-1;
    // fold "continue straight on the same road" into the previous row
    const prev=rows[rows.length-1];
    if(prev && (m.type==="new name"||m.type==="continue") && (m.modifier||"straight")==="straight" && roadLabel(st)===prev.road) continue;
    if(m.type==="depart" && i>0) continue; // start of the next leg after a stop
    const ins=instr(st,last), toll=(st.intersections||[]).some(x=>(x.classes||[]).includes("toll"));
    rows.push({i, st, ins, at, road:roadLabel(st), toll, leg: prevAt==null ? null : at-prevAt, last});
    prevAt=at;
  }
  return rows;
}
function directionsSheet(R, live){
  if(!R) return;
  const from = live ? Math.min(stepAt(R,S.lastIdx)+1, R.steps.length-1) : 0;
  const rows = buildDirections(R, from);
  const here = live ? R.cum[R.stepStart[from]] - (nearest(R, S.pos||R.pts[0], S.lastIdx).along) : 0;
  const turns = rows.filter(r=>!["depart","arrive"].includes(r.st.maneuver.type)).length;
  let h='<div class="grab"></div><div class="hd"><h2>Directions</h2><p>'+turns+' turns and junctions · '+fmtDist(live?R.cum[R.cum.length-1]-R.cum[R.stepStart[from]]+here:R.distance)+(S.dest?' to '+esc(S.dest.name):'')+'</p></div><ol class="dirs">';
  rows.forEach((r,k) => {
    const dist = live && k===0 ? Math.max(0,here) : r.leg;
    const meta=[r.ins.exitNo&&r.st.maneuver.type!=="off ramp"?"Exit "+esc(r.ins.exitNo):"", r.ins.towards?"towards "+esc(r.ins.towards):"", r.toll?"Toll road":""].filter(Boolean).join(" · ");
    h+='<li><button class="dr'+(live&&k===0?' now':'')+'" data-at="'+r.i+'">'+
       '<span class="da">'+arrowSVG(r.st)+'</span>'+
       '<span class="dt"><b>'+esc(r.ins.text)+'</b>'+(r.road&&!r.last?'<span class="rd">'+esc(r.road)+'</span>':'')+(meta?'<span class="mt2">'+meta+'</span>':'')+'</span>'+
       '<span class="dd2">'+(dist==null?'Start':fmtDist(dist))+'<small>'+(r.at>0&&!live?fmtDist(r.at):'')+'</small></span></button></li>';
  });
  h+='</ol><div class="row"><button class="btn" id="dirBack">'+(live?'Back to driving':'Back to routes')+'</button><button class="btn" id="dirShare">Share list</button></div>'+
     '<p class="hint">'+(live?'Distance to each step from the one before it, starting from where you are now.':'Big number: distance from the previous step. Small number: distance from the start.')+' Tap a step to see it on the map.</p>';
  openSheet(h);
  document.querySelectorAll(".dr").forEach(b => b.onclick=()=>{
    const st=R.steps[+b.dataset.at], loc=st.maneuver.location;

  });
  $("dirBack").onclick=()=>{ if(live){ S.follow=true; $("locBtn").classList.add("on"); closeSheet(); if(S.pos) followCam(S.pos,(S.speed||0)*3.6); } else { renderRouteSheet(); fitRoute(R); } };
  $("dirShare").onclick=async()=>{
    const text=(S.dest?"Directions to "+S.dest.name+"\n":"")+rows.map((r,k)=>(k+1)+". "+r.ins.full+(r.leg?" ("+fmtDist(r.leg)+")":"")).join("\n");
    try{ if(navigator.share){ await navigator.share({title:"Directions", text}); return; } }catch(e){ if(e.name==="AbortError") return; }
    try{ await navigator.clipboard.writeText(text); toast("Directions copied"); }catch(e){ toast("Couldn't copy on this phone"); }
  };
}

/* ---------------- instructions ---------------- */
function instr(step, isLast){
  const t=L(), m=step.maneuver, mod=m.modifier||"straight", road=step.ref||step.name||"";
  const exitNo=(step.exits||"").split(";")[0].trim(), towards=(step.destinations||"").replace(/;/g,", ").trim();
  let s, withRoad=true;
  switch(m.type){
    case "depart": s=t.depart; break;
    case "arrive": s=isLast?t.arrive:t.stop; withRoad=false; break;
    case "roundabout": case "rotary": s=m.exit?t.rb(m.exit):t.mod[mod]; break;
    case "exit roundabout": case "exit rotary": s=t.rbx; break;
    case "off ramp": s=(exitNo?t.exitN(exitNo):t.exit)+(mod.includes("left")?t.exitL:mod.includes("right")?t.exitR:""); break;
    case "on ramp": s=t.ramp; break;
    case "merge": s=t.merge; break;
    case "fork": s=t.keep[mod]||t.keep.straight; break;
    case "new name": case "continue": s=mod==="straight"?t.mod.straight:t.mod[mod]; break;
    default: s=t.mod[mod]||t.mod.straight;
  }
  const sign = towards && /ramp|fork|merge|roundabout|rotary|turn|end of road/.test(m.type) ? t.towards+towards : "";
  return {text:s, road:withRoad?road:"", towards, exitNo, full:s+(withRoad&&road?t.onto+road:"")+sign};
}
function arrowSVG(step){
  const m=step.maneuver, W='stroke="#fff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none"';
  if(m.type==="arrive") return '<svg viewBox="0 0 48 48"><path d="M24 44s-13-13.5-13-23a13 13 0 0 1 26 0c0 9.5-13 23-13 23z" fill="#e0412f"/><circle cx="24" cy="21" r="5" fill="#fff"/></svg>';
  if(m.type==="roundabout"||m.type==="rotary") return '<svg viewBox="0 0 48 48"><circle cx="24" cy="29" r="9" '+W+'/><path d="M24 20V5M17 11l7-7 7 7" '+W+'/><text x="24" y="33.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff" font-family="Saira Semi Condensed,sans-serif">'+(m.exit||"")+'</text></svg>';
  if(m.modifier==="uturn") return '<svg viewBox="0 0 48 48"><path d="M30 42V20a8 8 0 0 0-16 0v4M8 18l6 7 6-7" '+W+'/></svg>';
  const rot={straight:0,"slight right":40,right:90,"sharp right":135,"sharp left":-135,left:-90,"slight left":-40}[m.modifier||"straight"]||0;
  return '<svg viewBox="0 0 48 48"><g transform="rotate('+rot+' 24 30)"><path d="M24 44V12M14 21l10-10 10 10" '+W+'/></g></svg>';
}

/* ---------------- lane guidance ---------------- */
const LW='stroke="#fff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none"';
const ROT={straight:0,"slight right":40,right:90,"sharp right":135,"sharp left":-135,left:-90,"slight left":-40,none:0};
function laneSVG(ind){ if(ind==="uturn") return '<svg viewBox="0 0 48 48"><path d="M30 42V20a8 8 0 0 0-16 0v4M8 18l6 7 6-7" '+LW+'/></svg>';
  return '<svg viewBox="0 0 48 48"><g transform="rotate('+(ROT[ind]||0)+' 24 30)"><path d="M24 44V12M14 21l10-10 10 10" '+LW+'/></g></svg>'; }
function paintLanes(step, toMan){
  const el=$("lanes"), lanes=step?.intersections?.[0]?.lanes;
  if(!lanes || lanes.length<2 || toMan>1500){ el.hidden=true; return; }
  const want=step.maneuver.modifier||"straight";
  el.innerHTML=lanes.map(l=>{ const inds=l.indications&&l.indications.length?l.indications:["straight"];
    const ind=l.valid ? (inds.find(i=>i===want)||inds.find(i=>i!=="none")||"straight") : (inds[0]==="none"?"straight":inds[0]);
    return '<span class="lane'+(l.valid?' ok':'')+'">'+laneSVG(ind)+'</span>'; }).join("");
  el.hidden=false;

/* ---------------- route progress bar (destination at the top) ---------------- */
function buildProgress(){
  const R=S.R; if(!R) return; const total=R.cum[R.cum.length-1]||1;

  $("progMarks").innerHTML=R.hazAlong.map(x=>'<span class="pmark" style="bottom:'+(x.f*100).toFixed(2)+'%">'+HZ[x.h.type].e+'</span>').join("");
  S.progBuilt=Date.now();
}

/* ---------------- faster route found ---------------- */
async function checkBetter(p, leftSec, remain){
  try{
    const rs=scoreRoutes(await fetchRoutes(p,S.stops,S.dest)), best=rs[0];
    const save=leftSec-best.eff;
    if(S.nav && save>=180 && Math.abs(best.distance-remain)/Math.max(remain,1)>0.03) offerBetter(best, Math.round(save/60));

// Polyline decoding with plain arithmetic: precision-7 longitudes overflow 32-bit bitwise maths.
function decodePoly(str, prec){
  const f=Math.pow(10,prec), out=[]; let i=0, lat=0, lng=0;
  const next=()=>{ let r=0, m=1, b; do{ b=str.charCodeAt(i++)-63; r+=(b%32)*m; m*=32; }while(b>=32); return (r%2)? -(r+1)/2 : r/2; };
  while(i<str.length){ lat+=next(); lng+=next(); out.push([lng/f, lat/f]); }
  return out;
}
function legCoords(l){
  if(l._c) return l._c;
  const g=l.legGeometry, start={lat:l.from.lat, lng:l.from.lon};
  if(g && g.points){
    // read the precision from the leg; if the first point lands far from the stop, try the other precision
    const first=g.precision || (transitVer==="v1"?7:6);
    for(const pr of [first, first===7?6:7, 5]){ try{ const c=decodePoly(g.points, pr);
      if(c.length>1 && hav({lat:c[0][1],lng:c[0][0]}, start)<3000) return (l._c=c); }catch(e){} }
  }
  return (l._c=[[l.from.lon,l.from.lat],[l.to.lon,l.to.lat]]);
}
function legKm(l){ const c=legCoords(l); let d=0; for(let i=1;i<c.length;i++) d+=hav({lat:c[i-1][1],lng:c[i-1][0]},{lat:c[i][1],lng:c[i][0]}); return d/1000; }
// What a leg is, for icons and fares.
function legKind(l){
  const m=l.mode, ag=[l.agencyName,l.routeLongName,l.routeShortName,l.displayName].filter(Boolean).join(" ");
  if(m==="WALK") return "walk";
  if(m==="CAR"||m==="CAR_PARKING") return "car";
  if(/\bERL\b|KLIA (Ekspres|Transit)|express rail/i.test(ag)) return "erl";
  if(/\bETS\b|intercity|antarabandar/i.test(ag) || ["LONG_DISTANCE","HIGHSPEED_RAIL","REGIONAL_FAST_RAIL","NIGHT_RAIL"].includes(m)) return "ets";
  if(/KTM|komuter|keretapi/i.test(ag) || ["RAIL","REGIONAL_RAIL","SUBURBAN"].includes(m)) return "ktm";
  if(["SUBWAY","METRO","TRAM","MONORAIL","FUNICULAR","CABLE_CAR","AERIAL_LIFT","AREAL_LIFT"].includes(m)) return "rail";
  if(/\bBRT\b|sunway/i.test(ag)) return "brt";
  if(/go ?kl|bas percuma|free shuttle|smart selangor|bas ?mutiara percuma/i.test(ag)) return "free";
  if(m==="BUS"||m==="COACH") return /rapid|prasarana|feeder|myBAS/i.test(ag) ? "rapid" : "bus";
  if(m==="FERRY") return "ferry";
  return "other";
}
const KIND_ICO={walk:"🚶",car:"🚗",erl:"🚄",ets:"🚄",ktm:"🚆",rail:"🚇",brt:"🚌",free:"🚌",rapid:"🚌",bus:"🚌",ferry:"⛴️",other:"🚐"};
const KIND_COL={erl:"#6a2c91",ets:"#0f4c97",ktm:"#1964b7",rail:"#1463ff",brt:"#0a8f6a",free:"#7c3aed",rapid:"#1463ff",bus:"#2563eb",ferry:"#0891b2",other:"#475569",car:"#0f1d33"};
// Estimated adult cashless fares in RM. Real fares depend on the exact station pair; these are rough guides.
const clampN=(a,lo,hi)=>Math.min(hi,Math.max(lo,a));
function legFare(l){
  const k=legKind(l), km=legKm(l);
  switch(k){
    case "rail":  return clampN(0.5+0.16*km, 1.0, 6.5);
    case "ktm":   return clampN(0.6+0.12*km, 1.3, 12);
    case "ets":   return clampN(0.12*km, 9, 110);
    case "erl":   return km>40 ? 55 : clampN(0.9*km, 6, 55);
    case "brt":   return 1.0;
    case "rapid": return 1.0;

function itinFare(it){

  it.legs.forEach(l=>{ const k=legKind(l); if(k==="walk"||k==="car") return; if(k==="rail"){ railKm+=legKm(l); return; } flush(); total+=legFare(l); });

async function transitFetch(from, to, o){

  if(o.time){ q.set("time", new Date(o.time).toISOString()); if(o.arriveBy) q.set("arriveBy","true"); }
  const vers = transitVer ? [transitVer] : ["v5","v4","v3","v2","v1","v6"];
  let last="no answer";
  for(const v of vers){
    let res; try{ res=await fetch(TRANSIT_API+v+"/plan?"+q.toString()); }catch(e){ throw new Error("the public transport service couldn't be reached"); }
    if(res.status===404){ last="not found"; if(transitVer){ transitVer=null; store.set("trVer",null); return transitFetch(from,to,o); } continue; }

/* ---- step-by-step transit guidance ---- */
function itinRoute(it){
  const pts=[], legStart=[];
  it.legs.forEach(l=>{ legStart.push(Math.max(0,pts.length-1)); legCoords(l).forEach((c,j)=>{ if(pts.length && j===0) return; pts.push({lat:c[1],lng:c[0]}); }); });
  const cum=[0]; for(let i=1;i<pts.length;i++) cum[i]=cum[i-1]+hav(pts[i-1],pts[i]);
  const R={pts, cum, legStart, it};
  R.legEnd=it.legs.map((l,i)=>cum[i+1<legStart.length?legStart[i+1]:pts.length-1]);
  // where each intermediate stop sits along the line, to count stops left
  R.stopsAt=it.legs.map((l,i)=>(l.intermediateStops||[]).map(st=>isFinite(st.lat)?nearest(R,{lat:st.lat,lng:st.lon},legStart[i]).along:null).filter(x=>x!=null));
  return R;
}

const Awake = {
  lock:null, video:null, on:false,
  async start(){ this.on=true; await this.get(); this.fallback(); },
  async get(){
    if(!this.on || document.visibilityState!=="visible") return;
    if(this.lock && !this.lock.released) return;
    try{ this.lock = await navigator.wakeLock.request("screen"); this.lock.addEventListener("release", ()=>{ if(this.on) setTimeout(()=>this.get(), 500); }); }catch(e){ this.lock=null; }
  },
  // backup for phones where the wake lock is refused or dropped: a tiny muted looping video keeps the display awake
  fallback(){
    if(this.video) { this.video.play().catch(()=>{}); return; }
    try{ const c=document.createElement("canvas"); c.width=c.height=2; const g=c.getContext("2d"); let n=0;
      setInterval(()=>{ if(!this.on) return; g.fillStyle=(n++%2)?"#000":"#010101"; g.fillRect(0,0,2,2); }, 1000);
      const v=document.createElement("video"); v.muted=true; v.playsInline=true; v.setAttribute("playsinline",""); v.loop=true;
      v.style.cssText="position:fixed;width:1px;height:1px;opacity:0.01;pointer-events:none;left:0;top:0";
      if(c.captureStream){ v.srcObject=c.captureStream(1); document.body.appendChild(v); v.play().catch(()=>{}); this.video=v; } }catch(e){}
  },
  stop(){ this.on=false; try{ this.lock?.release(); }catch(e){} this.lock=null; try{ this.video?.pause(); }catch(e){} },
};

function nearest(R,p,from){
  const n=R.pts.length; let best={d:1e12,i:0,t:0};
  const scan=(a,b)=>{ for(let i=a;i<=b;i++){ const r=segProj(p,R.pts[i],R.pts[i+1]); if(r.d<best.d) best={d:r.d,i,t:r.t}; } };
  scan(Math.max(0,from-3), Math.min(n-2,from+400)); if(best.d>80) scan(0,n-2);
  best.along=R.cum[best.i]+best.t*(R.cum[best.i+1]-R.cum[best.i]); return best;
}

  const toMan=Math.max(0,R.cum[R.stepStart[nxt]]-near.along), remain=Math.max(0,R.cum[R.cum.length-1]-near.along);

  $("navArrow").innerHTML=arrowSVG(step); $("navDist").textContent=fmtDist(toMan);
  $("navIns").textContent=ins.text+(ins.road?t.onto+ins.road:""); $("navRoad").textContent=ins.towards?"Towards "+ins.towards:"";
  const after=R.steps[nxt+1];
  if(after && toMan<500 && step.distance<300 && after.maneuver.type!=="arrive"){ $("navThen").hidden=false; $("navThen").innerHTML=t.then+esc(instr(after,false).text); }
  else $("navThen").hidden=true;
  // trip bar — remaining time scaled from the route estimate, plus delays from reports still ahead
  const aheadPenalty = (R.alerts||[]).filter(a=>!S.passed[a.id] && a.src!=="tomtom").reduce((s,a)=>s+(HZ[a.type]?.delay||0),0)*60;
  const leftSec=R.duration*(remain/R.distance)+aheadPenalty;

    if(toMan<=(kmh>70?250:70) && !S.spoken[nxt+"n"]){ S.spoken[nxt+"n"]=1; say(ins.full); }
  }
  if(S.stops.length && hav(p,S.stops[0])<40){ say(t.stop); toast(t.stop); S.stops.shift(); stopMarkers.shift()?.remove(); }
  if(remain<1200 && motorised() && !S.parkOffered && !S.dest.isParking && !S.asking){ S.parkOffered=true;
    showPrompt('<span class="ae">🅿️</span><span class="at">Parking near '+esc(S.dest.name)+'?</span><button data-a="yes">Show</button><button data-a="no">No</button>',
      {yes:()=>openPlaces("parking", S.dest, 1000), no:()=>{}}, 12000); }
  S.hudInfo={arrow:arrowSVG(step), dist:fmtDist(toMan), ins:ins.text+(ins.road?" · "+ins.road:""), eta:clock(new Date(Date.now()+leftSec*1000))+" · "+fmtDist(remain)};
  if(S.hud) paintHud();
  if(remain<30){ say(t.arrive); toast(t.arrive+addPoints(20+Math.floor(R.distance/1000))); endNav(); return; }
  hazardCheck(p);
  if(S.appMode==="tourist") tourCommentary(p, near);
  if(S.mode==="foot") walkHint(nxt, toMan);
}

/* ---------------- test drive (simulation) ---------------- */
function startSim(){
  stopSim(); let d=0; const v=S.tnav?11:(MODES[S.mode]||MODES.car).sim;
  S.sim=setInterval(()=>{
    const R=S.R, total=R.cum[R.cum.length-1];
    if(d===0 && S.simFrom){ d=nearest(R,S.simFrom,0).along; S.simFrom=null; }
    d+=v*0.5; if(d>=total) d=total;
    let i=0; while(i<R.cum.length-2 && R.cum[i+1]<d) i++;
    const seg=R.cum[i+1]-R.cum[i]||1, f=(d-R.cum[i])/seg, a=R.pts[i], b=R.pts[i+1];
    S.heading=bearing(a,b); onPos({lat:a.lat+(b.lat-a.lat)*f, lng:a.lng+(b.lng-a.lng)*f}, S.heading, v);
    if(d>=total) stopSim();
  },500);
}
function stopSim(){ if(S.sim){ clearInterval(S.sim); S.sim=null; } }

// Local by default. With a Firebase Realtime Database URL in Settings, reports are shared with every driver using the same URL.
const Sync = {
  base(){ const u=(S.syncUrl||"").trim().replace(/\/+$/,""); return /^https:\/\/[a-z0-9.-]+\.(firebaseio\.com|firebasedatabase\.app)$/i.test(u)?u:""; },
  async pull(){ const b=this.base(); if(!b) return null; const j=await (await fetch(b+"/reports.json")).json(); return j||{}; },
  async put(r){ const b=this.base(); if(!b) return; await fetch(b+"/reports/"+encodeURIComponent(r.id)+".json",{method:"PUT",body:JSON.stringify({type:r.type,lat:r.lat,lng:r.lng,t:r.t,up:r.up||0,down:r.down||0})}); },
  async del(id){ const b=this.base(); if(!b) return; await fetch(b+"/reports/"+encodeURIComponent(id)+".json",{method:"DELETE"}); },
};
function valid(r){ return r && HZ[r.type] && isFinite(r.lat) && isFinite(r.lng) && isFinite(r.t) && Date.now()-r.t < HZ[r.type].ttl*60000; }
async function loadReports(){
  let list = store.get("reports",[]).filter(valid);
  try{ const remote=await Sync.pull();
    if(remote){ const rem=Object.entries(remote).map(([id,v])=>({id:String(id).slice(0,40), type:String(v?.type), lat:+v?.lat, lng:+v?.lng, t:+v?.t, up:+v?.up||0, down:+v?.down||0})).filter(valid);
      const ids=new Set(rem.map(r=>r.id)); list=[...rem, ...list.filter(r=>!ids.has(r.id)&&!r.synced)]; }
  }catch(e){ /* offline: keep local */ }
  S.reports=list; store.set("reports",list); drawReports();
}
function saveReports(){ store.set("reports",S.reports); drawReports(); }
function drawReports(){
  hzMarkers.forEach(m=>m.remove()); hzMarkers=[];
  const cams = S.nav ? (S.R?.cams||[]) : (S.routes[S.sel]?.cams||[]);
  [...S.reports, ...S.incidents, ...cams].forEach(r => {
    const el=document.createElement("div"); el.className="hzpin"+(r.src==="tomtom"?" tt":r.src==="osm"?" osm":""); el.textContent=HZ[r.type].e;
    const mk=new maplibregl.Marker({element:el}).setLngLat(ll(r)).addTo(map);
    el.addEventListener("click", ev => { ev.stopPropagation(); reportPopup(r, mk); });

}

    d.innerHTML='<b>'+HZ[r.type].e+' '+esc(hzName(r.type))+'</b><div class="m">'+(r.src==="tomtom"?esc(r.desc||"")+(r.road?'<br>'+esc(r.road):'')+(r.delay?'<br>Delay about '+Math.max(1,Math.round(r.delay/60))+' min':'')+'<br>Live traffic from TomTom':'Fixed camera'+(r.limit?' · limit '+r.limit+' km/h':'')+' · from OpenStreetMap')+'</div>';

function hazardCheck(p){
  let shown=null;
  allHazards(true).forEach(r => { const d=hav(p,r), ahead=Math.abs(((bearing(p,r)-S.heading+540)%360)-180)<60;
    const warnAt = r.type==="camera" ? 600 : 800;
    if(d<warnAt && ahead && d>25){ if(!shown||d<shown.d) shown={r,d};
      if(!S.alerted[r.id]){ S.alerted[r.id]=1; if(r.type==="camera"||r.type==="police") beep(1);
        say(r.type==="camera" ? L().camAhead(r.limit) : L().ahead(HZ[r.type].v?.[S.lang]||hzName(r.type))); } }
    else if(S.alerted[r.id] && !S.passed[r.id] && d<=40){ S.passed[r.id]=1; if(!r.src) askStillThere(r); }
  });
  const a=$("alert"); if(S.asking) return;
  if(shown){ a.hidden=false; a.innerHTML='<span class="ae">'+HZ[shown.r.type].e+'</span><span class="at">'+esc(hzName(shown.r.type))+(shown.r.limit?' · '+shown.r.limit+' km/h':'')+' · '+fmtDist(shown.d)+'</span>'; }
  else a.hidden=true;
}

function placeInfo(k, tg){
  const bits=[];
  if(tg.brand && tg.name && tg.name!==tg.brand) bits.push(tg.name);
  if(k==="food" && tg.cuisine) bits.push(tg.cuisine.replace(/;/g,", ").replace(/_/g," "));
  if(k==="parking"){ if(tg.fee==="no") bits.push("Free"); else if(tg.fee==="yes") bits.push("Paid"); if(tg.capacity) bits.push(tg.capacity+" bays"); if(tg.parking==="multi-storey") bits.push("Multi-storey"); }
  if(k==="ev"){ const sockets=Object.keys(tg).filter(x=>/^socket:[^:]+$/.test(x)).map(x=>x.slice(7).replace(/_/g," ")); if(sockets.length) bits.push(sockets.join(", ")); if(tg.operator) bits.push(tg.operator); }
  if(tg.opening_hours==="24/7") bits.push("Open 24 hours"); else if(tg.opening_hours && tg.opening_hours.length<26) bits.push(tg.opening_hours);
  if(tg["addr:street"]) bits.push(tg["addr:street"]);
  return bits.join(" · ");
}
async function openPlaces(k, center, radius){
  const cat=NEARBY[k]; if(!cat) return;
  const c=center||S.pos||{lat:map.getCenter().lat, lng:map.getCenter().lng}, rr=radius||(S.nav?Math.max(cat.r,3000):3000);
  const near = center ? "near "+(center.name||"there") : "within "+fmtDist(rr);
  openSheet('<div class="grab"></div><div class="hd"><h2>'+cat.ico+' '+esc(cat.label)+'</h2><p>'+esc(near)+'</p></div><p class="hint">Looking nearby…</p>');
  const q='[out:json][timeout:15];(node(around:'+rr+','+c.lat+','+c.lng+')'+cat.q+';way(around:'+rr+','+c.lat+','+c.lng+')'+cat.q+';);out center 60;';
  const fail=msg=>{ openSheet('<div class="grab"></div><div class="hd"><h2>'+cat.ico+' '+esc(cat.label)+'</h2></div><p class="hint">'+msg+'</p><div class="row"><button class="btn" id="cl">Back</button></div>'); $("cl").onclick=()=>{ clearFuel(); openNearby(); }; };
  try{
    const j=await (await fetch(CFG.overpass,{method:"POST", body:"data="+encodeURIComponent(q)})).json();
    let list=(j.elements||[]).map(e=>{ const lat=e.lat??e.center?.lat, lng=e.lon??e.center?.lon, tg=e.tags||{};
      return {name:tg.brand||tg.name||cat.label, sub:placeInfo(k,tg), lat, lng}; }).filter(f=>isFinite(f.lat));
    list.forEach(f=>{ f.d=hav(c,f);
      if(S.nav && S.R && !center){ f.off=minDistToRoute(S.R,f); f.ahead=nearest(S.R,f,S.lastIdx).along >= nearest(S.R,c,S.lastIdx).along; }
      else { f.off=null; f.ahead=true; } });
    // driving: places on or near the route and ahead of you first (smallest detour)
    list.sort((a,b)=> S.nav&&!center ? ((b.ahead-a.ahead) || (a.off-b.off) || (a.d-b.d)) : a.d-b.d);
    list=list.slice(0,15);

    S.voicePick=false;

    h+='</div><div class="row"><button class="btn" id="bk">Back</button><button class="btn" id="cl">Close</button></div>';

    $("bk").onclick=()=>{ clearFuel(); showCircle(null); openNearby(); }; $("cl").onclick=()=>{ clearFuel(); showCircle(null); afterSheet(); };
  }catch(e){ fail("Place search isn't reachable right now. Try again in a moment."); }

function tagInfo(k, tg){

  if(tg.stars) b.push(tg.stars+"★");
  if(tg.tourism && k==="sight") b.push(tg.tourism.replace(/_/g," "));
  if(tg.historic) b.push(tg.historic.replace(/_/g," "));
  if(tg.religion && tg.amenity==="place_of_worship") b.push(tg.religion);

function sampleRoute(Rt, step, cap){

async function wikiNear(lat, lng, radius, limit){

// Places along a route: OpenStreetMap by category + Wikipedia landmarks, each placed along the route with its side.
async function loadTour(Rt){

  const parts=Object.entries(TOUR).map(([k,c])=>"("+c.q.map(f=>"nwr(around:"+c.r+","+line+")"+f+";").join("")+");out center tags "+(k==="food"||k==="cafe"?120:80)+";");
  const q="[out:json][timeout:30];"+parts.join("");
  const run=(async()=>{
    const found=new Map();
    const osm=overpass(q).then(j=>{ (j.elements||[]).forEach(e=>{ const tg=e.tags||{}, lat=e.lat??e.center?.lat, lng=e.lon??e.center?.lon; if(!isFinite(lat)||!tg.name) return;
        const k=catOf(tg,Object.keys(TOUR)); if(!k) return; const key=tg.name.toLowerCase()+"|"+lat.toFixed(3)+lng.toFixed(3); if(found.has(key)) return;
        found.set(key,{name:tg["name:en"]&&S.lang!=="zh"?tg["name:en"]:tg.name, lat, lng, cat:k, sub:tagInfo(k,tg), rec:isFamous(tg), recWhy:!isFamous(tg)?"":(tg.wikidata||tg.wikipedia)?"well known":"famous with visitors", tg}); }); }).catch(()=>{});

    await Promise.all([osm,wk]);
    const list=[...found.values()];
    // attach Wikipedia photos/blurbs to matching map places, keep the rest as landmarks
    const seen=new Set();
    wikis.forEach(w=>{ if(seen.has(w.name)) return; seen.add(w.name);
      const m=list.find(x=>hav(x,w)<250 && (x.name.toLowerCase().includes(w.name.toLowerCase().split(" (")[0]) || w.name.toLowerCase().includes(x.name.toLowerCase())));

    Rt.tour.list=list.filter(x=>x.off<=(x.cat==="wiki"?600:(TOUR[x.cat]?.r||300)+60)).sort((a,b)=>a.along-b.along);

    Rt.tour.loading=null;

}

/* ---------------- walking guide with street photos and landmarks ---------------- */
const COMPASS=["north","north-east","east","south-east","south","south-west","west","north-west"];
const compassName = b => COMPASS[Math.round(((b%360)+360)%360/45)%8];

function walkCheckpoints(o){
  const C=o.coords; if(!C || C.length<2) return [];
  const P=C.map(c=>({lat:c[1],lng:c[0]}));
  if(o.steps && o.steps.length){
    return o.steps.filter((st,i)=>!(st.maneuver.type==="depart"&&i>0)).slice(0,14).map((st,i,arr)=>{ const g=st.geometry?.coordinates||[], loc=st.maneuver.location||g[0];
      const b = st.maneuver.bearing_after!=null ? st.maneuver.bearing_after : (g.length>1? bearing({lat:g[0][1],lng:g[0][0]},{lat:g[1][1],lng:g[1][0]}) : 0);
      const ins=instr(st, i===arr.length-1); return {lat:loc[1], lng:loc[0], bearing:b, text:ins.full, kind:st.maneuver.type, mod:st.maneuver.modifier, dist:st.distance}; });
  }
  // no steps (public transport walking legs): find the turns in the path
  const pts=[P[0]]; P.forEach(p=>{ if(hav(pts[pts.length-1],p)>=15) pts.push(p); }); if(pts.length<2) pts.push(P[P.length-1]);
  const cps=[{...pts[0], bearing:bearing(pts[0],pts[1]), text:"Start walking "+compassName(bearing(pts[0],pts[1])), kind:"depart"}];
  let acc=0;
  for(let i=1;i<pts.length-1;i++){ const b1=bearing(pts[i-1],pts[i]), b2=bearing(pts[i],pts[i+1]); let d=((b2-b1+540)%360)-180; acc+=hav(pts[i-1],pts[i]);
    if(Math.abs(d)>=35 && acc>25){ cps.push({...pts[i], bearing:b2, text:turnText(d), kind:"turn", mod:d>0?"right":"left", dist:acc}); acc=0; } }
  const last=pts[pts.length-1]; cps.push({...last, bearing:bearing(pts[pts.length-2],last), text:"Arrive at "+(o.title||"your destination").replace(/^Walk to /,""), kind:"arrive", dist:acc+hav(pts[pts.length-2],last)});
  if(cps.length>12){ const mid=cps.slice(1,-1).sort((a,b)=>Math.abs(b.dist||0)-Math.abs(a.dist||0)).slice(0,10); return [cps[0], ...cps.filter(c=>mid.includes(c)), cps[cps.length-1]]; }
  return cps;
}
async function streetPhoto(cp){

  let out=null;
  if(S.mlyKey){ try{ const d=0.00045, u="https://graph.mapillary.com/images?access_token="+encodeURIComponent(S.mlyKey)+"&fields=id,thumb_1024_url,computed_geometry,compass_angle&limit=25&bbox="+
      [cp.lng-d,cp.lat-d,cp.lng+d,cp.lat+d].map(x=>x.toFixed(6)).join(",");
    const j=await (await fetch(u)).json();
    const best=(j.data||[]).filter(x=>x.thumb_1024_url && x.computed_geometry).map(x=>{ const g=x.computed_geometry.coordinates, dist=hav(cp,{lat:g[1],lng:g[0]});
      const ad=Math.abs((((x.compass_angle||0)-(cp.bearing||0))+540)%360-180); return {x, score:dist+ad/3}; }).sort((a,b)=>a.score-b.score)[0];
    if(best) out={url:best.x.thumb_1024_url, credit:"© Mapillary contributors, CC BY-SA", link:"https://www.mapillary.com/app/?pKey="+best.x.id, street:true}; }catch(e){} }
  if(!out){ try{ const u="https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=geosearch&ggsnamespace=6&ggscoord="+cp.lat.toFixed(5)+"%7C"+cp.lng.toFixed(5)+
      "&ggsradius=90&ggslimit=10&prop=coordinates%7Cimageinfo&iiprop=url%7Cextmetadata&iiurlwidth=640&colimit=10";
    const j=await (await fetch(u)).json();
    const files=Object.values(j.query?.pages||{}).filter(p=>p.imageinfo?.[0]?.thumburl && /\.(jpe?g|webp)$/i.test(p.title) && !/map|logo|diagram|locator|plan\b|svg/i.test(p.title))
      .map(p=>({p, d:p.coordinates?.[0]?hav(cp,{lat:p.coordinates[0].lat,lng:p.coordinates[0].lon}):999})).sort((a,b)=>a.d-b.d);
    if(files.length){ const f=files[0].p, ii=f.imageinfo[0], m=ii.extmetadata||{}; const who=String(m.Artist?.value||"").replace(/<[^>]*>/g,"").trim().slice(0,40);
      out={url:ii.thumburl, credit:(who?who+" · ":"")+(m.LicenseShortName?.value||"Wikimedia Commons"), link:ii.descriptionurl||"", street:false}; } }catch(e){} }

}
async function walkLandmarks(cps, coords){
  if(!cps.length) return;
