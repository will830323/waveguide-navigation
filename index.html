  const f=['["name"]["amenity"]','["name"]["shop"]','["name"]["tourism"]','["name"]["historic"]','["name"]["railway"="station"]','["name"]["public_transport"="station"]','["name"]["leisure"="park"]'];
  try{ const j=await overpass("[out:json][timeout:20];("+f.map(x=>"nwr(around:45,"+line+")"+x+";").join("")+");out center tags 400;");
    const L0=(j.elements||[]).map(e=>({name:(e.tags["name:en"]&&S.lang!=="zh")?e.tags["name:en"]:e.tags.name, lat:e.lat??e.center?.lat, lng:e.lon??e.center?.lon, w:(e.tags.tourism||e.tags.historic||e.tags.railway)?1:0})).filter(x=>isFinite(x.lat));
    cps.forEach(cp=>{ const cand=L0.map(x=>({x, d:hav(cp,x)})).filter(o=>o.d<45).sort((a,b)=>(a.d-a.x.w*15)-(b.d-b.x.w*15))[0];
      if(cand){ const brg=bearing(cp,cand.x), rel=((brg-(cp.bearing||0))+540)%360-180; cp.landmark=cand.x.name; cp.lmSide=Math.abs(rel)<30?"ahead":rel>0?"on your right":"on your left"; cp.lmDist=cand.d; } });
  }catch(e){}
}

function localDT(ms){ const d=new Date(ms); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16); }
const isoZ = ms => new Date(ms).toISOString().replace(/\.\d{3}Z$/,"Z");
function myLoc(){ return S.pos ? {name:"My location", lat:S.pos.lat, lng:S.pos.lng, me:true} : null; }
function openTripPlanner(pre){
  const P = S.tp = Object.assign({from:null, to:null, when:"now", at:""}, S.tp&&!pre?S.tp:{}, pre||{});
  if(P.to && P.to.name==="My location") P.to=null;

    '<div class="tpf"><div class="tpin"><span class="dot a">A</span><input id="tpFrom" placeholder="📍 My location" autocomplete="off" value="'+esc(P.from?P.from.name:"")+'"></div>'+
    '<button class="tpswap" id="tpSwap" aria-label="Swap start and destination">⇅</button>'+

  openSheet(h);
  $("tpWhen").value=P.when; if(!P.at){ const d=new Date(Date.now()+60*60000); d.setMinutes(Math.ceil(d.getMinutes()/15)*15,0,0); P.at=localDT(d.getTime()); } $("tpAt").value=P.at;
  $("tpWhen").onchange=e=>{ P.when=e.target.value; $("tpAt").hidden=P.when==="now"; if(P.res) runPlanner(); };
  $("tpAt").onchange=e=>{ P.at=e.target.value; if(P.res) runPlanner(); };
  $("tpSwap").onclick=()=>{ const a=P.from||myLoc(), b=P.to; P.from=b&&!b.me?b:null; P.to=a&&!a.me?a:(a||null); if(P.to&&P.to.me) P.to=null;
    $("tpFrom").value=P.from?P.from.name:""; $("tpTo").value=P.to?P.to.name:""; if(P.to) runPlanner(); };
  $("tpGo").onclick=()=>runPlanner();
  $("tpClose").onclick=()=>{ S.tp=null; afterSheet(); };
  ["tpFrom","tpTo"].forEach(id=>{ const inp=$(id), which=id==="tpFrom"?"from":"to"; let t;

    inp.onkeydown=e=>{ if(e.key==="Enter"){ clearTimeout(t); tpSuggest(which, inp.value.trim(), true); } }; });
  if(P.auto && P.to){ P.auto=false; runPlanner(); }

}
async function tpSuggest(which, v, pickFirst){
  const P=S.tp, box=$("tpSug"); if(!box) return;
  let list=[];
  if(!v || v.length<3){
    const me=myLoc(); if(which==="from" && me) list.push({...me, sub:"Use where you are now", ico:"📍"});
    ["home","work"].forEach(k=>{ if(S.saved[k]) list.push({...S.saved[k], ico:k==="home"?"🏠":"🏢"}); });
    S.recent.forEach(r=>list.push({...r, ico:"🕘"}));
  } else { list=(await searchPlaces(v)||[]).map(r=>({...r, ico:"📍"})); }
  if(S.tp!==P || !$("tpSug")) return;
  if(pickFirst && list.length){ tpPick(which, list[0]); return; }
  box.innerHTML = list.length ? list.slice(0,7).map((r,i)=>'<button data-tps="'+i+'"><span style="font-size:18px">'+r.ico+'</span><span style="min-width:0"><b>'+esc(r.name)+'</b><span>'+esc(r.sub||"")+'</span></span></button>').join("") : '<button disabled><span>No places found. Try another spelling.</span></button>';
  box.hidden=false;
  box.querySelectorAll("[data-tps]").forEach(b=>b.onmousedown=b.onclick=ev=>{ ev.preventDefault(); tpPick(which, list[+b.dataset.tps]); });
}
function tpPick(which, r){
  const P=S.tp; P[which] = r.me ? null : {name:r.name, sub:r.sub||"", lat:r.lat, lng:r.lng};
  if(which==="to" && r.me){ P.to=myLoc(); }
  $(which==="from"?"tpFrom":"tpTo").value = r.me ? (which==="from"?"":"My location") : r.name;
  $("tpSug").hidden=true; document.activeElement?.blur();
  if(which==="from" && !P.to) $("tpTo").focus(); else if(P.to) runPlanner();
}
// TomTom: traffic-aware time for "now", or predicted traffic for a departure / arrival time
async function ttTrip(from, to, mode, when, atMs){
  if(!S.ttKey) return null;
  let u=CFG.tomtom+"/routing/1/calculateRoute/"+from.lat.toFixed(6)+","+from.lng.toFixed(6)+":"+to.lat.toFixed(6)+","+to.lng.toFixed(6)+"/json?key="+encodeURIComponent(S.ttKey)+
    "&traffic=true&computeTravelTimeFor=all&routeRepresentation=summaryOnly&travelMode="+(mode==="moto"?"motorcycle":"car");
  if(when==="depart") u+="&departAt="+encodeURIComponent(isoZ(atMs)); else if(when==="arrive") u+="&arriveAt="+encodeURIComponent(isoZ(atMs));
  try{ const j=await (await fetch(u)).json(); return j.routes?.[0]?.summary||null; }catch(e){ return null; }
}
function scaleByTraffic(list, sm){
  if(!sm || !list) return false; const base=sm.noTrafficTravelTimeInSeconds||sm.travelTimeInSeconds, f=Math.min(4,Math.max(0.85,sm.travelTimeInSeconds/base));
  list.forEach(r=>{ r.trafficDelay=Math.max(0,r.duration*(f-1)); r.duration*=f; r.eff=(r.eff||r.duration)*1; r.traffic=true; }); return true;
}
async function runPlanner(){
  const P=S.tp; if(!P) return;
  const from = P.from || myLoc() || (S.pos?null:{name:"Map centre", lat:map.getCenter().lat, lng:map.getCenter().lng});
  if(!P.to){ toast("Choose where you're going (B)."); $("tpTo")?.focus(); return; }
  if(!from){ toast("Choose a starting point (A)."); return; }
  if(hav(from,P.to)<30){ toast("A and B are the same place."); return; }
  const atMs = P.when==="now" ? Date.now() : new Date(P.at).getTime();
  if(P.when!=="now" && !isFinite(atMs)){ toast("Pick a date and time."); return; }
  P.res={loading:true}; P.fromUsed=from; paintPlanner();
  const straight=hav(from,P.to)/1000, res={};
  const tasks=[
    osrmRoutes(MODES.car.osrm, from, [], P.to).then(async list=>{ list.forEach(r=>{ r.alerts=[]; r.penalty=0; r.eff=r.duration; });
      const sm=await ttTrip(from,P.to,"car",P.when,atMs); scaleByTraffic(list, sm);
      list.forEach(r=>r.eff=r.duration); list.sort((a,b)=>a.eff-b.eff); res.car=list; }).catch(()=>{}),
    valhallaRoutes(from, [], P.to, "motorcycle").then(async list=>{ const sm=await ttTrip(from,P.to,"moto",P.when,atMs); scaleByTraffic(list, sm); res.moto=list[0]; }).catch(()=>{}),
    transitFetch(from, P.to, {time:P.when==="now"?null:atMs, arriveBy:P.when==="arrive"}).then(j=>{
      const its=(j.itineraries||[]).filter(it=>it.legs&&it.legs.some(l=>!["WALK","CAR","CAR_PARKING"].includes(l.mode)));
      its.forEach(it=>it.info=itinInfo(it)); if(its.length) res.transit={its, best:its[bestIndex(its)]}; }).catch(()=>{}),
  ];
  if(straight<6) tasks.push(osrmRoutes(MODES.foot.osrm, from, [], P.to).then(l=>{ res.foot=l[0]; }).catch(()=>{}));
  if(straight<25) tasks.push(osrmRoutes(MODES.bike.osrm, from, [], P.to).then(l=>{ res.bike=l[0]; }).catch(()=>{}));
  await Promise.all(tasks);
  if(S.tp!==P) return;
  // build comparable options with depart / arrive times
  const opts=[], when=P.when, timesFor=dur=>{ if(when==="arrive") return {depart:atMs-dur*1000, arrive:atMs}; const d=when==="now"?Date.now():atMs; return {depart:d, arrive:d+dur*1000}; };
  if(res.car&&res.car[0]){ const r=res.car[0]; opts.push({key:"car", ico:"🚗", label:"Drive", dur:r.duration, dist:r.distance, ...timesFor(r.duration),
    via:r.via.join(", ")||"local roads", toll:r.toll, traffic:r.traffic, delay:r.trafficDelay||0, score:r.duration/60+8, alts:res.car}); }
  if(res.moto){ const r=res.moto; opts.push({key:"moto", ico:"🏍️", label:"Motorcycle", dur:r.duration, dist:r.distance, ...timesFor(r.duration), via:r.via.join(", ")||"local roads", toll:r.toll, traffic:r.traffic, score:r.duration/60+4}); }
  if(res.transit){ const it=res.transit.best, f=it.info; let km=0; it.legs.forEach(l=>km+=legKm(l));
    opts.push({key:"transit", ico:"🚇", label:"Public transport", dur:it.duration, dist:km*1000, depart:tms(it.startTime), arrive:tms(it.endTime), it, fare:f.fare,
      chips:it.legs.map(legChip).filter(Boolean).join('<span class="legsep">›</span>'), changes:f.changes, walkMin:f.walkMin,
      score:it.duration/60+f.changes*5+f.walkMin*0.4+f.fare*1.5-(S.appMode==="tourist"?5:0)}); }
  if(res.bike && res.bike.duration<75*60) opts.push({key:"bike", ico:"🚲", label:"Bicycle", dur:res.bike.duration, dist:res.bike.distance, ...timesFor(res.bike.duration), via:res.bike.via.join(", ")||"", score:res.bike.duration/60*1.25+(res.bike.duration>40*60?15:0)});
  if(res.foot && res.foot.duration<90*60) opts.push({key:"foot", ico:"🚶", label:"Walk", dur:res.foot.duration, dist:res.foot.distance, ...timesFor(res.foot.duration), via:res.foot.via.join(", ")||"", score:res.foot.duration/60*(res.foot.duration>20*60?1.6:1)});
  if(!opts.length){ P.res={err:"Couldn't plan this trip right now. Check your connection and try again."}; paintPlanner(); return; }
  const fastest=opts.reduce((a,b)=>a.dur<=b.dur?a:b), rec=opts.reduce((a,b)=>a.score<=b.score?a:b);
  opts.forEach(o=>{ o.fastest=o===fastest; o.rec=o===rec; });
  opts.sort((a,b)=>(b.rec-a.rec)||a.dur-b.dur);
  const car=opts.find(o=>o.key==="car");
  let why = rec.fastest ? "The fastest way"+(opts.length>1?", "+fmtDur(Math.max(0,(opts.filter(o=>o!==rec).reduce((a,b)=>a.dur<=b.dur?a:b).dur-rec.dur)))+" quicker than the next option":"")+"." :
    rec.key==="transit" ? (car?"Only "+fmtDur(Math.max(60,rec.dur-car.dur))+" slower than driving, with no parking or tolls":"No parking or tolls")+" · fare ≈ RM"+rec.fare.toFixed(2)+"." :
    rec.key==="foot" ? "A short walk: no waiting, parking or fares." :
    rec.key==="bike" ? "A short ride: free and avoids traffic." :
    rec.key==="moto" ? "Quicker than a car once parking is counted." : "Best balance of time and effort.";
  if(rec.key==="car" && rec.toll) why+=" Uses toll roads.";
  if((rec.key==="car"||rec.key==="moto") && !rec.traffic) why+=" Times are typical traffic"+(S.ttKey?"":"; add a TomTom key in Settings for live and predicted traffic")+".";
  P.res={opts, rec, why, from, to:P.to, open:rec.key};
  paintPlanner();
}

      if(o.it) h+=itinSteps(o.it);

const DBRE=/^https:\/\/[a-z0-9.-]+\.(firebaseio\.com|firebasedatabase\.app)$/i;
const Live = {
  code:null, timer:null,
  async start(){
    if(!Sync.base()){ toast("Live location uses the shared database. Add it in Settings first."); openSettings(); return null; }
    if(!this.code){ const abc="ABCDEFGHJKMNPQRSTUVWXYZ23456789", r=new Uint8Array(12); crypto.getRandomValues(r); this.code=[...r].map(x=>abc[x%abc.length]).join(""); this.started=Date.now(); }
    await this.push(); clearInterval(this.timer); this.timer=setInterval(()=>this.push(),10000); return this.code;
  },
  async push(){ if(!this.code || !S.pos) return;
    if(Date.now()-(this.started||0) > 8*3600e3){ this.stop(); toast("Live location sharing ended after 8 hours."); return; } /* never share forever */
    const body={name:(S.myName||"Panduan driver").slice(0,40), lat:+S.pos.lat.toFixed(6), lng:+S.pos.lng.toFixed(6), heading:Math.round(S.heading||0),
      speed:Math.round((S.speed||0)*3.6), t:Date.now(), dest:S.dest?{name:String(S.dest.name).slice(0,80)}:null, eta:S.nav&&S.lastLeft?Math.round(Date.now()+S.lastLeft*1000):null};
    try{ await fetch(Sync.base()+"/live/"+this.code+".json",{method:"PUT", body:JSON.stringify(body)}); }catch(e){} },
  async stop(){ clearInterval(this.timer); this.timer=null; const c=this.code; this.code=null;
    if(c && Sync.base()) try{ await fetch(Sync.base()+"/live/"+c+".json",{method:"DELETE"}); }catch(e){} },
  link(){ return location.origin+location.pathname+"#follow="+this.code+"&db="+encodeURIComponent(Sync.base().replace("https://","")); },
};
const Follow = {
  codes:store.get("follow",[]), db:store.get("followDb",""), markers:{}, data:{}, timer:null,
  base(){ return DBRE.test(this.db) ? this.db : Sync.base(); },
  add(code, db){
    code=String(code||"").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,16);
    if(code.length<10){ toast("That code looks too short. Codes have 12 letters and numbers."); return; }
    if(db){ const u="https://"+String(db).replace(/^https?:\/\//,"").replace(/\/+$/,""); if(DBRE.test(u)){ this.db=u; store.set("followDb",u); } }
    if(!this.base()){ toast("Following needs the same shared database as your friend. Open the link they sent."); return; }
    if(!this.codes.includes(code)) this.codes.push(code); store.set("follow",this.codes);
    this.start(); this.poll(); toast("Following "+code);
  },
  remove(code){ this.codes=this.codes.filter(c=>c!==code); store.set("follow",this.codes); this.markers[code]?.remove(); delete this.markers[code]; delete this.data[code]; renderFriends(); },
  start(){ if(!this.timer && this.codes.length) this.timer=setInterval(()=>this.poll(),5000); },
  async poll(){ const b=this.base(); if(!b) return;
    for(const c of this.codes){ try{ this.show(c, await (await fetch(b+"/live/"+c+".json")).json()); }catch(e){} }
    renderFriends(); },
  show(c, v){
    if(!v || !isFinite(+v.lat) || !isFinite(+v.lng) || Date.now()-(+v.t||0) > 2*3600e3){ /* stale shares end */ this.markers[c]?.remove(); delete this.markers[c]; this.data[c]=null; return; }
    const d={name:String(v.name||"Friend").slice(0,40), lat:+v.lat, lng:+v.lng, heading:+v.heading||0, speed:+v.speed||0, t:+v.t||0,
      dest:v.dest&&v.dest.name?String(v.dest.name).slice(0,80):"", eta:+v.eta||0};
    this.data[c]=d;
    if(!this.markers[c]){ const el=document.createElement("div"); el.className="friend";
      el.innerHTML='<span class="car"><svg viewBox="0 0 24 24"><path d="M12 3l6 15-6-3.5L6 18z" fill="#fff"/></svg></span><span class="nm"></span>';
      el.onclick=ev=>{ ev.stopPropagation(); map.easeTo({center:[this.data[c].lng,this.data[c].lat], zoom:15}); };
      this.markers[c]=new maplibregl.Marker({element:el}).setLngLat([d.lng,d.lat]).addTo(map); }
    this.markers[c].setLngLat([d.lng,d.lat]); const el=this.markers[c].getElement();
    el.querySelector(".nm").textContent=d.name; el.querySelector(".car svg").style.transform="rotate("+(d.heading-map.getBearing())+"deg)";
  },
};

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const CMD_HZ = [["police",/police|polis|警察|cop/],["accident",/accident|crash|kemalangan|车祸|事故/],["jam",/jam|traffic|sesak|塞车|堵车/],["flood",/flood|banjir|水灾|淹水/],

const CMD_NEAR = [["fuel",/petrol|gas station|fuel|minyak|stesen minyak|加油|油站/],["parking",/parking|letak kereta|parkir|停车/],["food",/food|eat|restaurant|makan|吃|餐厅|饭/],

function setMic(on){ ["micBtn","micFab"].forEach(id=>$(id).classList.toggle("listening",on)); }
function listen(){
  if(!SR){ toast("Voice commands aren't supported in this browser."); return; }
  const rec=new SR(); rec.lang={en:"en-MY",ms:"ms-MY",zh:"zh-CN"}[S.lang]||"en-MY"; rec.interimResults=false; rec.maxAlternatives=1;
  setMic(true); if("speechSynthesis" in window) speechSynthesis.cancel();

  rec.onerror=e=>toast(e.error==="not-allowed"?"Allow the microphone to use voice commands.":"Didn't catch that. Tap the mic and try again.");
  rec.onend=()=>setMic(false);

function go(place){ if(S.nav){ S.dest=place; S.stops=[]; destMarker?.remove(); destMarker=pin("destpin",place); S.lastReroute=0; reroute(S.pos||S.R.pts[S.lastIdx]); } else setDest(place); }
async function runCommand(raw){
  const t=raw.toLowerCase().trim();
  if(/(faster route|switch route|take (the )?faster|laluan (lebih )?pantas|tukar laluan|更快|切换路线)/.test(t)){ if(!takeBetter()) toast("No faster route on offer right now."); return; }
  if(S.lockOn && CMD_NEAR.some(([,re])=>re.test(t))) S.voicePick=true; // hands-free: add the best one as a stop
  if(/(report|lapor|报告|举报)/.test(t)){ const hit=CMD_HZ.find(([,re])=>re.test(t)); if(hit) makeReport(hit[0]); else openReport(); return; }
  if(/(unmute|voice on|hidupkan suara|开启语音|取消静音)/.test(t)){ S.voice=true; store.set("voice",true); paintVoice(); say("Voice on"); return; }
  if(/^(mute|senyap|diam|静音|关闭语音)/.test(t)){ S.voice=false; store.set("voice",false); paintVoice(); toast("Voice muted"); return; }
  if(/(stop navigation|end navigation|cancel route|tamat navigasi|berhenti navigasi|结束导航|停止导航)/.test(t)){ if(S.nav) endNav(); return; }
  if(/(go home|take me home|balik rumah|pulang|回家)/.test(t)){ if(S.saved.home) go(S.saved.home); else toast("Set Home first: pick a place, then tap Set as Home."); return; }
  if(/(go to work|to the office|ke pejabat|pergi kerja|上班|去公司)/.test(t)){ if(S.saved.work) go(S.saved.work); else toast("Set Work first: pick a place, then tap Set as Work."); return; }
  if(/(share|kongsi|分享)/.test(t)){ openShareSheet(); return; }
  if(/(hud|head.?up)/.test(t)){ toggleHud(true); return; }
  const m=t.match(/^(?:navigate to|navigate|go to|take me to|drive to|directions to|pergi ke|bawa saya ke|导航到|导航去|带我去|去)\s*(.+)$/);
  const near=CMD_NEAR.find(([,re])=>re.test(t));
  if(near && (!m || /(near|nearby|nearest|closest|find|cari|terdekat|berdekatan|附近|最近|找)/.test(t))){ openPlaces(near[0]); return; }
  let q=(m?m[1]:raw).trim(); if(!q) return;
  if(/(by (bus|train|lrt|mrt|public transport)|naik (bas|tren|lrt|mrt)|坐(巴士|地铁|火车)|搭(巴士|地铁))/.test(q)){ setTravelMode("transit"); q=q.replace(/\s*(by (bus|train|lrt|mrt|public transport)|naik (bas|tren|lrt|mrt)|坐(巴士|地铁|火车)|搭(巴士|地铁))\s*/g," ").trim(); }
  const list=await searchPlaces(q);
  if(!list || !list.length){ toast("No place called \""+q+"\" found."); return; }
  if(S.nav){ go(list[0]); toast("Going to "+list[0].name); return; }
  $("q").value=q; $("clearQ").hidden=false; if(m) pickPlace(list[0]); else showResults(list);
}

function dayTime(ms){ const d=new Date(ms), today=new Date(); const same=d.toDateString()===today.toDateString();
  return (same?"":d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"})+" ")+clock(d); }
function gcalStamp(ms){ return new Date(ms).toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,""); }
async function predictTime(r, arriveMs){
  if(!S.ttKey || !motorised()) return null;
  try{ const from=S.pos||{lat:r.pts[0].lat,lng:r.pts[0].lng};
    const u=CFG.tomtom+"/routing/1/calculateRoute/"+from.lat.toFixed(6)+","+from.lng.toFixed(6)+":"+S.dest.lat.toFixed(6)+","+S.dest.lng.toFixed(6)+"/json?key="+encodeURIComponent(S.ttKey)+
      "&traffic=true&routeRepresentation=summaryOnly&travelMode="+(S.mode==="moto"?"motorcycle":"car")+"&arriveAt="+encodeURIComponent(new Date(arriveMs).toISOString().replace(/\.\d{3}Z$/,"Z"));
    const j=await (await fetch(u)).json(); return j.routes?.[0]?.summary?.travelTimeInSeconds||null; }catch(e){ return null; }
}
function openPlan(){
  const r=S.routes[S.sel]; if(!r||!S.dest) return;
  const d=new Date(Date.now()+3600e3); d.setMinutes(Math.ceil(d.getMinutes()/15)*15,0,0);
  const local=new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16);
  openSheet('<div class="grab"></div><div class="hd"><h2>Plan this drive</h2><p>'+esc(S.dest.name)+' · '+(MODES[S.mode]||MODES.car).label+'</p></div>'+
    '<label class="sec" for="planAt">Arrive by</label><input class="field" id="planAt" type="datetime-local" value="'+local+'">'+
    '<div class="sec">Leave by</div><div class="plan-leave" id="planLeave">--:--</div><p class="hint" id="planNote" style="margin-top:2px"></p>'+
    '<div class="row"><button class="btn go" id="planSave">Remind me</button></div>'+
    '<div class="row"><a class="btn sm" id="planCal" target="_blank" rel="noopener" style="text-decoration:none;color:inherit">📅 Add to Google Calendar</a><button class="btn sm" id="planBack">Back to routes</button></div>'+
    '<p class="hint">The reminder shows while Panduan is open. The calendar event reminds you even when it is closed.</p>');
  let plan=null;
  const calc=async()=>{
    const arrive=new Date($("planAt").value).getTime(); if(!isFinite(arrive)) return;
    let secs=r.eff, note="Based on today's route time plus 10 minutes buffer.";
    const pred=await predictTime(r, arrive); if(pred){ secs=pred; note="Uses TomTom's predicted traffic for that time, plus 10 minutes buffer."; }
    const leave=arrive-(secs+600)*1000;
    $("planLeave").textContent=dayTime(leave); $("planNote").textContent=note+(leave<Date.now()?" That's already past, so leave now.":"");
    plan={id:Date.now().toString(36), dest:{name:S.dest.name, sub:S.dest.sub, lat:S.dest.lat, lng:S.dest.lng}, arrive, leave, mode:S.mode};
    $("planCal").href="https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent("Drive to "+S.dest.name)+
      "&dates="+gcalStamp(leave)+"/"+gcalStamp(arrive)+"&details="+encodeURIComponent("Leave by "+clock(new Date(leave))+" to arrive by "+clock(new Date(arrive))+". Open Panduan to navigate.")+
      "&location="+encodeURIComponent(S.dest.lat.toFixed(6)+","+S.dest.lng.toFixed(6));
  };
  $("planAt").onchange=calc; calc();
  $("planSave").onclick=async()=>{ if(!plan) return; S.plans=[...S.plans.filter(p=>p.arrive>Date.now()), plan]; store.set("plans",S.plans);
    try{ if("Notification" in window && Notification.permission==="default") await Notification.requestPermission(); }catch(e){}
    toast("Reminder set: leave "+dayTime(plan.leave)); renderRouteSheet(); };
  $("planBack").onclick=renderRouteSheet;
}
async function notify(title, body){
  toast(title+" · "+body); say(title);
  try{ if("Notification" in window && Notification.permission==="granted"){
    const reg=await navigator.serviceWorker?.getRegistration?.(); if(reg) reg.showNotification(title,{body, icon:"icon-192.png", badge:"logo-96.png"}); else new Notification(title,{body}); } }catch(e){}
}
function checkPlans(){
  const now=Date.now(); let changed=false;
  S.plans.forEach(p=>{ if(!p.notified && now>=p.leave-10*60000 && now<p.arrive){ p.notified=true; changed=true;
    notify("Time to leave for "+p.dest.name, "Leave by "+clock(new Date(p.leave))+" to arrive by "+clock(new Date(p.arrive))); } });
  const keep=S.plans.filter(p=>p.arrive>now-3600e3); if(keep.length!==S.plans.length) changed=true; S.plans=keep;
  if(changed) store.set("plans",S.plans);
}

/* ---------------- settings ---------------- */
function openSettings(){
  const seg=(id,opts,val)=>'<div class="seg" id="'+id+'">'+opts.map(([v,l])=>'<button data-v="'+v+'" class="'+(v===val?"on":"")+'">'+l+'</button>').join("")+'</div>';
  const sw=(id,on)=>'<button class="sw'+(on?" on":"")+'" id="'+id+'" role="switch" aria-checked="'+on+'"></button>';
  const row=(t,sub,ctl)=>'<div class="li"><span class="tx"><b>'+t+'</b><span>'+sub+'</span></span>'+ctl+'</div>';
  const block=(t,sub,inner)=>'<div class="li" style="display:block"><b>'+t+'</b><span style="display:block">'+sub+'</span>'+inner+'</div>';
  const lv=levelOf(S.points), nx=nextLevel(S.points);
  const follows=Follow.codes.map(c=>'<div class="li"><span class="tx"><b>'+esc(Follow.data[c]?.name||c)+'</b><span>Code '+c+'</span></span><button class="btn sm" data-unfollow="'+c+'">Stop</button></div>').join("");
  openSheet('<div class="grab"></div><div class="hd"><h2>Settings</h2><p>Saved on this phone.</p></div>'+
    '<div class="pts"><span style="font-size:28px">🏅</span><span style="flex:1"><b>'+S.points+'</b> points<br><span>'+lv[1]+(nx?' · '+(nx[0]-S.points)+' to '+nx[1]:'')+' · '+S.myReports+' report'+(S.myReports===1?'':'s')+'</span></span></div>'+
    '<div class="list">'+
    '<div class="sec">Mode</div>'+
    block('Use mode','Normal: everyday navigation. Tourist: places, landmarks and famous food along your route, landmark commentary and photo walking guides.',
      '<div style="margin-top:8px">'+seg("setAppMode",[["normal","🧭 Normal"],["tourist","🧳 Tourist / traveller"]],S.appMode)+'</div>')+
    block('Street photos (optional)','A free Mapillary client token adds street-level photos facing your walking direction. Without it, photos come from Wikimedia Commons. Get one at mapillary.com/dashboard/developers.',
      '<input class="field" id="setMly" type="text" autocomplete="off" spellcheck="false" placeholder="MLY|… client token" value="'+esc(S.mlyKey)+'">')+
    '<div class="sec">Voice</div>'+
    row('Voice language','Directions, warnings and voice commands', seg("setLang",[["en","EN"],["ms","BM"],["zh","中文"]],S.lang))+
    row('Voice guidance','Turn-by-turn and hazard warnings', sw("setVoice",S.voice))+
    '<div class="sec">Routes</div>'+
    block('Travel mode','Used for new routes; you can also switch on the route screen', '<div style="margin-top:8px">'+seg("setMode",Object.entries(MODES).map(([k,m])=>[k,m.ico+" "+m.label]),S.mode)+'</div>')+
    row('Avoid tolls','Car and motorcycle', sw("setToll",S.avoidTolls))+
    row('Avoid highways','Car and motorcycle', sw("setHw",S.avoidHw))+
    row('Shortest route','Shortest distance instead of fastest time', sw("setShort",S.shortest))+
    '<div class="sec">Map</div>'+
    block('Map type','Also on the map button', '<div style="margin-top:8px">'+seg("setMapT",Object.entries(MAPTYPES).map(([k,v])=>[k,v.label]),S.mapType)+'</div>')+
    row('Heading-up 3D view','Off: north always at the top. On: the map turns with you.', sw("setHead",S.headUp))+
    row('HUD mode','Big mirrored speed and turns for the windscreen. Also: tap the speedometer.', '<button class="btn sm" id="setHud">Open</button>')+
    '<div class="sec">Live traffic</div>'+
    block('TomTom API key','Free key from developer.tomtom.com → My Dashboard. Adds coloured traffic, traffic-aware ETAs, live incidents and predicted times for planned drives.',
      '<input class="field" id="setTT" type="text" autocomplete="off" spellcheck="false" placeholder="Paste your TomTom key" value="'+esc(S.ttKey)+'">')+
    (S.ttKey?row('Show traffic on map','Green, orange and red roads', sw("setTraffic",S.traffic)):'')+
    '<div class="sec">Community</div>'+
    block('Shared database','Firebase Realtime Database URL. Shares reports and lets friends follow your live location. Leave empty to keep everything on this phone.',
      '<input class="field" id="setSync" type="url" inputmode="url" placeholder="https://your-project-default-rtdb.asia-southeast1.firebasedatabase.app" value="'+esc(S.syncUrl)+'">')+
    block('Your name','Shown to friends when you share live location','<input class="field" id="setName" type="text" maxlength="40" placeholder="e.g. William" value="'+esc(S.myName)+'">')+
    block('Follow a friend','Enter the code from their live location link','<div class="row" style="margin-top:8px"><input class="field" id="setFollow" type="text" maxlength="16" placeholder="12-character code" style="margin:0;flex:1;text-transform:uppercase"><button class="btn sm" id="setFollowBtn">Follow</button></div>')+
    follows+
    '<div class="sec">Data</div>'+
    row('Clear history','Recent places, Home, Work and planned drives', '<button class="btn sm warn" id="setClear">Clear</button>')+
    '</div><div class="row"><button class="btn" id="setDone">Done</button></div>'+
    '<div class="sec">Legal</div>'+
    '<div class="list">'+[["terms.html","📄 Terms of use"],["privacy.html","🔒 Privacy policy"],["LICENSE","⚖️ Open-source licence (MIT)"],["https://transitous.org/sources/","🚇 Public transport timetable sources"],["https://www.openstreetmap.org/copyright","🗺️ OpenStreetMap copyright"]]
      .map(([u,l])=>'<a class="li" href="'+u+'" target="_blank" rel="noopener" style="text-decoration:none;color:inherit"><span class="tx"><b>'+l+'</b></span><span>›</span></a>').join("")+'</div>'+
    '<p class="hint">Map © OpenStreetMap contributors · OpenFreeMap · Routing OSRM & Valhalla (FOSSGIS) · Search Photon · Places Overpass · Public transport Transitous · Traffic © TomTom · Landmarks Wikipedia & Wikimedia Commons (CC BY-SA) · Street photos Mapillary (CC BY-SA)</p>');
  const segBind=(id,fn)=>$(id).querySelectorAll("button").forEach(b=>b.onclick=()=>{ $(id).querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b)); fn(b.dataset.v); });
  const swBind=(id,fn)=>{ if(!$(id)) return; $(id).onclick=()=>{ const on=!$(id).classList.contains("on"); $(id).classList.toggle("on",on); $(id).setAttribute("aria-checked",on); fn(on); }; };
  segBind("setAppMode",v=>setAppMode(v));
  $("setMly").onchange=e=>{ S.mlyKey=e.target.value.trim(); store.set("mlyKey",S.mlyKey); S.photoCache={}; toast(S.mlyKey?"Street photos on":"Using Wikimedia Commons photos"); };
  segBind("setLang",v=>{ S.lang=v; store.set("lang",v); drawReports(); say(v==="ms"?"Bahasa Melayu":v==="zh"?"中文语音":"English voice"); });
  swBind("setVoice",on=>{ S.voice=on; store.set("voice",on); paintVoice(); });
  segBind("setMode",v=>setTravelMode(v));
  swBind("setToll",on=>{ S.avoidTolls=on; store.set("avoidTolls",on); });
  swBind("setHw",on=>{ S.avoidHw=on; store.set("avoidHw",on); });
  swBind("setShort",on=>{ S.shortest=on; store.set("shortest",on); });
  swBind("setHead",on=>{ S.headUp=on; store.set("headUp2",on); });
  swBind("setTraffic",on=>setTraffic(on));
  segBind("setMapT",v=>setMapType(v));
  $("setHud").onclick=()=>{ closeSheet(); toggleHud(true); };
  $("setTT").onchange=e=>{ const k=e.target.value.trim(); if(k===S.ttKey) return; S.ttKey=k; store.set("ttKey",k);
    if(map.getLayer("ttflow")) map.removeLayer("ttflow"); if(map.getSource("ttflow")) map.removeSource("ttflow");
    if(k){ addTrafficLayer(); loadIncidents(); toast("Live traffic on"); } else { S.incidents=[]; drawReports(); toast("Live traffic off"); } };
  $("setSync").onchange=e=>{ const v=e.target.value.trim(); if(v===S.syncUrl) return; S.syncUrl=v; store.set("syncUrl",v);
    if(v && !Sync.base()) toast("That doesn't look like a Firebase database URL."); else { toast(v?"Shared database on":"Everything stays on this phone"); loadReports(); } };
  $("setName").onchange=e=>{ S.myName=e.target.value.trim().slice(0,40); store.set("myName",S.myName); };
  $("setFollowBtn").onclick=()=>{ Follow.add($("setFollow").value); openSettings(); };
  document.querySelectorAll("[data-unfollow]").forEach(b=>b.onclick=()=>{ Follow.remove(b.dataset.unfollow); openSettings(); });
  $("setClear").onclick=()=>{ S.recent=[]; S.saved={}; S.plans=[]; store.set("recent",[]); store.set("saved",{}); store.set("plans",[]); renderChips(); toast("History cleared"); };
  $("setDone").onclick=()=>{ ["setTT","setSync","setName","setMly"].forEach(id=>$(id).dispatchEvent(new Event("change"))); afterSheet(); };
}
$("setBtn").onclick=openSettings;
function openMapTypes(){
  let h='<div class="grab"></div><div class="hd"><h2>Map type</h2><p>Choose how the map looks. Your route stays on top.</p></div><div class="mtgrid">';
  Object.entries(MAPTYPES).forEach(([k,v])=> h+='<button class="mt'+(k===S.mapType?' on':'')+'" data-mt="'+k+'"><span class="mtsw mt-'+k+'">'+v.ico+'</span>'+v.label+'</button>');
  h+='</div>'+(S.ttKey?'<div class="li" style="margin-top:10px"><span class="tx"><b>🚦 Live traffic</b><span>Green, orange and red roads from TomTom</span></span><button class="sw'+(S.traffic?' on':'')+'" id="mtTraffic" role="switch" aria-checked="'+S.traffic+'"></button></div>':
     '<p class="hint">Add a free TomTom key in Settings to see live traffic colours.</p>')+
     '<p class="hint">Landmarks shows more shops, malls, mosques, temples, hospitals and petrol stations.</p>';
  openSheet(h);
  if($("mtTraffic")) $("mtTraffic").onclick=()=>{ const on=!S.traffic; setTraffic(on); $("mtTraffic").classList.toggle("on",on); };
  document.querySelectorAll("[data-mt]").forEach(b=>b.onclick=()=>{ setMapType(b.dataset.mt); afterSheet(); });
}
$("layersBtn").onclick=openMapTypes;

/* ---------------- buttons ---------------- */
$("reportBtn").onclick=openReport;
$("locBtn").onclick=()=>{ S.follow=true; $("locBtn").classList.add("on");
  if(!S.pos){ toast("Waiting for GPS signal…"); return; }
  if(S.nav||S.tnav) followCam(S.pos,(S.speed||0)*3.6); else map.easeTo({center:ll(S.pos), zoom:Math.max(map.getZoom(),15), bearing:0, pitch:0, padding:camPad(), duration:600}); };
$("compass").onclick=()=>{ if(S.nav){ S.headUp=!S.headUp; store.set("headUp2",S.headUp); toast(S.headUp?"Heading-up 3D":"North-up"); if(S.pos&&S.follow) followCam(S.pos,(S.speed||0)*3.6); }
  else map.easeTo({bearing:0, pitch:0, duration:500}); };
function paintVoice(){ $("voiceBtn").classList.toggle("on",S.voice); $("voiceWaves").style.opacity=S.voice?1:.15; }
$("voiceBtn").onclick=()=>{ S.voice=!S.voice; store.set("voice",S.voice); paintVoice(); toast(S.voice?"Voice on":"Voice muted"); if(S.voice) say(S.lang==="ms"?"Suara dihidupkan":S.lang==="zh"?"语音已开启":"Voice on"); };

/* ---------------- boot ---------------- */
// keep buttons and map padding in step with the sheet whenever its content changes height
if("ResizeObserver" in window) new ResizeObserver(()=>{ if(!$("sheet").classList.contains("closed")) setSheetVar(sheetH()); }).observe($("sheet"));
paintVoice(); renderChips(); paintTSwitch(); loadReports(); legalGate(startGPS);
setInterval(loadReports, 30000);
setInterval(()=>{ if(S.ttKey) loadIncidents().then(()=>{ if(S.nav) buildProgress(); }); }, 300000);
setInterval(checkPlans, 60000); setTimeout(checkPlans, 3000);
if(S.ttKey) setTimeout(loadIncidents, 2500);
// open a friend's live-location link: #follow=CODE&db=host
(function(){ const h=location.hash.slice(1); const m=h.match(/^follow=([A-Za-z0-9]{10,16})(?:&db=([^&]+))?/);
  if(m){ Follow.add(m[1], m[2]?decodeURIComponent(m[2]):""); try{ history.replaceState(null,"",location.pathname); }catch(e){} }
  Follow.start(); if(Follow.codes.length) Follow.poll(); })();
if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
if(location.protocol==="file:") setTimeout(()=>toast("Open this over https (e.g. GitHub Pages) so your phone allows GPS."),1500);
</script>
